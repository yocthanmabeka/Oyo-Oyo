<!doctype html>
<!-- Le showreel de Claude, en HTML, CSS et JavaScript, sans bibliothèque.
     Le même scénario en sept scènes que ../holocode/showreel.holo, poussé au maximum de ce que
     le web offre : particules physiques sur un canevas, morphing SVG, cube en 3D, Web Animations,
     parallaxe à la souris. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude — Motion Showreel (HTML, CSS, JavaScript)</title>
<style>
  :root {
    --fond: #05050c; --or: #E9B44C; --creme: #FFE9A8; --gris: #9aa4c7;
    --rose: #F472B6; --turquoise: #4ECDC4; --violet: #A78BFA; --bleu: #60A5FA; --rouge: #FF6B6B;
    --ressort: linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);
    --rebond: linear(0,.004,.016,.035,.063,.098,.141 13.6%,.25,.391,.563,.765,1,.891 40.9%,.848,.813,.785,.766,.754,.75,.754,.766,.785,.813,.848,.891 68.2%,1 72.7%,.973,.953,.941,.938,.941,.953,.973,1,.988,.984,.988,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: white; font-family: "Inter", system-ui, sans-serif; overflow: hidden; }
  canvas#ciel { position: fixed; inset: 0; width: 100%; height: 100%; }
  #scene-monde { position: fixed; inset: 0; perspective: 1200px; }
  #plateau { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.16,1,.3,1); }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    text-align: center; opacity: 0; visibility: hidden; padding: 16px; }
  .scene.active { visibility: visible; }
  h1, h2, p { margin: 0; }
  .titre { font-size: clamp(56px, 12vw, 128px); font-weight: 800; letter-spacing: -.02em; color: var(--creme);
    text-shadow: 0 0 40px rgba(233,180,76,.35); }
  .role { font-size: clamp(18px, 3vw, 28px); font-weight: 400; color: var(--gris); letter-spacing: .3em; text-transform: uppercase; }
  .legende { font-size: clamp(16px, 2.2vw, 22px); color: var(--gris); }
  .lettre { display: inline-block; will-change: transform, opacity, filter; }
  .mot { display: inline-block; white-space: nowrap; }
  .trait { width: min(360px, 60vw); height: 2px; background: linear-gradient(90deg, transparent, var(--or), transparent); transform-origin: center; }
  .grand { font-size: clamp(44px, 9vw, 96px); font-weight: 800; letter-spacing: -.02em; }
  .degrade { background: linear-gradient(90deg, var(--rose), var(--violet), var(--turquoise), var(--or), var(--rose)); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: couler 3s linear infinite; }
  @keyframes couler { to { background-position: 300% 0; } }
  .secoue { animation: secousse .35s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes secousse { 10%,90% { translate: -2px 1px; } 20%,80% { translate: 4px -2px; } 30%,50%,70% { translate: -7px 3px; } 40%,60% { translate: 7px -3px; } }
  /* Le laboratoire des courbes */
  .labo { display: grid; grid-template-columns: auto 70px min(340px, 50vw); gap: 14px 18px; align-items: center; }
  .labo code { font: 15px ui-monospace, Consolas, monospace; color: var(--gris); text-align: right; }
  .labo svg { width: 70px; height: 44px; overflow: visible; }
  .piste { position: relative; height: 28px; border-bottom: 1px dashed rgba(154,164,199,.25); }
  .bille { position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; box-shadow: 0 0 18px currentColor; background: currentColor; }
  /* Le cube */
  .cube { width: 180px; height: 180px; position: relative; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 22px; border: 1px solid var(--or);
    background: rgba(20,20,40,.82); border-radius: 18px; box-shadow: inset 0 0 40px rgba(233,180,76,.18); backface-visibility: visible; }
  .face:nth-child(1) { transform: translateZ(90px); } .face:nth-child(2) { transform: rotateY(90deg) translateZ(90px); }
  .face:nth-child(3) { transform: rotateY(180deg) translateZ(90px); } .face:nth-child(4) { transform: rotateY(-90deg) translateZ(90px); }
  .face:nth-child(5) { transform: rotateX(90deg) translateZ(90px); color: var(--or); } .face:nth-child(6) { transform: rotateX(-90deg) translateZ(90px); color: var(--or); }
  /* La fin */
  .engage { position: relative; overflow: hidden; font-size: clamp(24px, 4vw, 36px); font-weight: 800; color: var(--fond); background: var(--or);
    border: 0; border-radius: 999px; padding: 14px 40px; cursor: pointer; transition: translate .25s cubic-bezier(.16,1,.3,1); box-shadow: 0 10px 40px rgba(233,180,76,.35); }
  .engage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.65) 50%, transparent 65%);
    translate: -120% 0; animation: reflet 2.2s ease-in-out infinite; }
  @keyframes reflet { 60%, 100% { translate: 120% 0; } }
  .compteur { font: 700 18px ui-monospace, Consolas, monospace; color: var(--turquoise); }
  @media (prefers-reduced-motion: reduce) {
    .scene { opacity: 0 !important; visibility: hidden !important; }
    .scene:last-child { opacity: 1 !important; visibility: visible !important; }
    *, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="ciel"></canvas>
<div id="scene-monde"><div id="plateau">

  <section class="scene" data-duree="4.5" data-nom="bigbang">
    <div style="height: 300px"></div>
    <p class="legende" data-entree="legende">Tout commence par un point.</p>
  </section>

  <section class="scene" data-duree="4" data-nom="titre">
    <h1 class="titre" data-lettres>CLAUDE</h1>
    <div class="trait"></div>
    <h2 class="role" data-lettres>Motion designer</h2>
  </section>

  <section class="scene" data-duree="4.5" data-nom="mots">
    <h1 class="grand" id="penser">Penser.</h1>
    <h1 class="grand" id="concevoir" style="color: var(--turquoise)">Concevoir.</h1>
    <h1 class="grand degrade" id="animer" data-lettres>Animer.</h1>
  </section>

  <section class="scene" data-duree="4.5" data-nom="morph">
    <svg viewBox="-120 -120 240 240" width="260" height="260" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9B44C"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
        <filter id="lueur"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path id="forme" fill="url(#g)" filter="url(#lueur)"/>
    </svg>
    <p class="legende">Squash, stretch, morph.</p>
  </section>

  <section class="scene" data-duree="5" data-nom="labo">
    <div class="labo" id="labo"></div>
    <p class="legende" data-entree="legende">Le mouvement a un caractère.</p>
  </section>

  <section class="scene" data-duree="4.5" data-nom="cube">
    <div class="cube" id="cube">
      <div class="face">Rust</div><div class="face">WebGPU</div><div class="face">HoloCode</div>
      <div class="face">Big Bang</div><div class="face">60 fps</div><div class="face">↻</div>
    </div>
    <p class="legende">La profondeur, à la souris.</p>
  </section>

  <section class="scene" data-duree="4.5" data-nom="fin">
    <h1 class="titre" data-lettres>Holoverse</h1>
    <p class="legende">Fait en HTML · CSS · JavaScript · <span class="compteur" id="compteur">0</span> bibliothèque</p>
    <button class="engage" id="engage" type="button">Engagez-moi.</button>
  </section>

</div></div>

<script>
  // ——— Outils ———————————————————————————————————————————————————————————————
  const css = getComputedStyle(document.documentElement);
  const RESSORT = css.getPropertyValue("--ressort").trim();
  const REBOND = css.getPropertyValue("--rebond").trim();
  const COURBES = {
    linear: "linear", smooth: "cubic-bezier(.65,0,.35,1)", out: "cubic-bezier(.16,1,.3,1)",
    back: "cubic-bezier(.34,1.56,.64,1)", spring: RESSORT, bounce: REBOND,
  };
  const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const attendre = (ms) => new Promise((r) => setTimeout(r, ms));

  // Coupe un titre en lettres, chacune animable, en gardant les mots entiers.
  function enLettres(el) {
    if (el.dataset.coupe) return [...el.querySelectorAll(".lettre")];
    el.dataset.coupe = "1";
    const mots = el.textContent.split(" ");
    el.textContent = "";
    mots.forEach((mot, i) => {
      const boite = document.createElement("span");
      boite.className = "mot";
      for (const c of mot) {
        const l = document.createElement("span");
        l.className = "lettre";
        l.textContent = c;
        boite.append(l);
      }
      el.append(boite);
      if (i < mots.length - 1) el.append(" ");
    });
    return [...el.querySelectorAll(".lettre")];
  }
  const lettres = (el, images, { ecart = 0.05, duree = 0.8, courbe = COURBES.out, depuis = 0 } = {}) =>
    enLettres(el).forEach((l, i) => l.animate(images, { duration: duree * 1000, delay: (depuis + i * ecart) * 1000, easing: courbe, fill: "both" }));

  // ——— Le ciel : étoiles, point originel, particules ————————————————————————————
  const ciel = document.getElementById("ciel");
  const ctx = ciel.getContext("2d");
  let L = 0, H = 0, ratio = 1;
  function dimensionner() {
    ratio = Math.min(devicePixelRatio || 1, 2);
    L = innerWidth; H = innerHeight;
    ciel.width = L * ratio; ciel.height = H * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  dimensionner();
  addEventListener("resize", dimensionner);
  const etoiles = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(), z: Math.random(), p: Math.random() * 6.28 }));
  let particules = [];
  let noyau = null; // { naissance, eclat }
  const PALETTE = ["#E9B44C", "#FF6B6B", "#4ECDC4", "#A78BFA", "#F472B6", "#60A5FA", "#FFE9A8"];
  const souris = { x: 0, y: 0 };
  addEventListener("pointermove", (e) => { souris.x = e.clientX / L - 0.5; souris.y = e.clientY / H - 0.5; });

  function eclater(cx, cy) {
    for (let i = 0; i < 520; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 1.5 + Math.random() ** 0.7 * 10.5;
      particules.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 1, r: 0.6 + Math.random() * 2.6, c: PALETTE[i % PALETTE.length] });
    }
  }

  let avant = performance.now();
  function dessiner(maintenant) {
    const dt = Math.min(48, maintenant - avant) / 16.67;
    avant = maintenant;
    // Traînées : on n'efface pas tout, on estompe ce qui a été dessiné (le fond de la page
    // reste derrière : aucun fantôme ne s'accumule).
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(0, 0, L, H);
    ctx.globalCompositeOperation = "lighter";
    for (const e of etoiles) {
      const x = (e.x + souris.x * e.z * 0.04) * L, y = (e.y + souris.y * e.z * 0.04) * H;
      ctx.globalAlpha = 0.25 + 0.35 * Math.sin(maintenant / 700 + e.p) ** 2;
      ctx.fillStyle = "#cfd6ff";
      ctx.fillRect(x, y, e.z * 1.6, e.z * 1.6);
    }
    ctx.globalAlpha = 1;
    const cx = L / 2, cy = H / 2 - 30;
    if (noyau) {
      const age = (maintenant - noyau.naissance) / 1000;
      if (age < 1.4) {
        const battement = 1 + 0.25 * Math.sin(age * 18);
        const r = Math.min(1, age / 0.6) * 34 * battement;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 3);
        g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.25, "rgba(255,233,168,.9)"); g.addColorStop(1, "rgba(233,180,76,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, r * 3, 0, Math.PI * 2); ctx.fill();
      } else if (!noyau.eclat) {
        noyau.eclat = true;
        eclater(cx, cy);
        document.getElementById("plateau").classList.add("secoue");
        setTimeout(() => document.getElementById("plateau").classList.remove("secoue"), 400);
      }
      if (noyau.eclat && age < 1.7) {
        // L'onde de choc
        const k = (age - 1.4) / 0.3;
        ctx.strokeStyle = `rgba(255,233,168,${1 - k})`; ctx.lineWidth = 3 * (1 - k);
        ctx.beginPath(); ctx.arc(cx, cy, 40 + k * Math.max(L, H) * 0.6, 0, Math.PI * 2); ctx.stroke();
      }
    }
    for (const p of particules) {
      p.vx *= 0.972 ** dt; p.vy = p.vy * 0.972 ** dt + 0.018 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.vie -= 0.0042 * dt;
      ctx.globalAlpha = Math.max(0, p.vie);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    particules = particules.filter((p) => p.vie > 0);
    ctx.globalAlpha = 1;
    requestAnimationFrame(dessiner);
  }
  requestAnimationFrame(dessiner);

  // ——— Les scènes ——————————————————————————————————————————————————————————————
  const JOUER = {
    bigbang(s) {
      noyau = { naissance: performance.now(), eclat: false };
      s.querySelector("p").animate([{ opacity: 0, translate: "0 16px", filter: "blur(6px)" }, { opacity: 1, translate: "0 0", filter: "blur(0)" }],
        { duration: 900, delay: 2200, easing: COURBES.out, fill: "both" });
    },
    titre(s) {
      lettres(s.querySelector(".titre"), [
        { opacity: 0, transform: "translateY(90px) rotate(-25deg) rotateX(-80deg)", filter: "blur(12px)" },
        { opacity: 1, transform: "none", filter: "blur(0)" }], { ecart: 0.07, duree: 1.1, courbe: RESSORT });
      s.querySelector(".trait").animate([{ scale: "0 1" }, { scale: "1 1" }], { duration: 1000, delay: 800, easing: COURBES.smooth, fill: "both" });
      lettres(s.querySelector(".role"), [{ opacity: 0, translate: "0 24px" }, { opacity: 1, translate: "0 0" }], { ecart: 0.025, duree: 0.6, depuis: 1.1 });
    },
    mots(s) {
      const penser = s.querySelector("#penser");
      penser.animate([{ opacity: 0, scale: 3, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0)" }], { duration: 600, easing: COURBES.out, fill: "both" })
        .finished.then(() => { s.classList.add("secoue"); setTimeout(() => s.classList.remove("secoue"), 400); });
      s.querySelector("#concevoir").animate([
        { opacity: 0, transform: "translateX(-500px) skewX(30deg)", filter: "blur(10px)" },
        { opacity: 1, transform: "translateX(20px) skewX(-8deg)", filter: "blur(0)", offset: 0.75 },
        { opacity: 1, transform: "none" }], { duration: 800, delay: 900, easing: COURBES.out, fill: "both" });
      lettres(s.querySelector("#animer"), [{ opacity: 0, transform: "perspective(600px) rotateY(90deg)" }, { opacity: 1, transform: "none" }],
        { ecart: 0.05, duree: 0.7, courbe: COURBES.back, depuis: 1.8 });
    },
    morph(s) {
      // Quatre formes, chacune en quatre courbes : le navigateur passe de l'une à l'autre.
      const carre = "M-80,-80 C-27,-80 27,-80 80,-80 C80,-27 80,27 80,80 C27,80 -27,80 -80,80 C-80,27 -80,-27 -80,-80 Z";
      const rond = "M0,-90 C50,-90 90,-50 90,0 C90,50 50,90 0,90 C-50,90 -90,50 -90,0 C-90,-50 -50,-90 0,-90 Z";
      const goutte = "M0,-100 C40,-60 85,-20 70,30 C55,85 -55,85 -70,30 C-85,-20 -40,-60 0,-100 Z";
      const coeur = "M0,-35 C30,-95 110,-60 75,5 C55,40 20,65 0,90 C-20,65 -55,40 -75,5 C-110,-60 -30,-95 0,-35 Z";
      const forme = s.querySelector("#forme");
      forme.setAttribute("d", carre);
      forme.animate([{ d: `path("${carre}")` }, { d: `path("${rond}")` }, { d: `path("${goutte}")` }, { d: `path("${coeur}")` }, { d: `path("${carre}")` }],
        { duration: 4000, easing: COURBES.smooth, fill: "both" });
      forme.parentElement.animate([{ rotate: "-180deg", scale: 0 }, { rotate: "0deg", scale: 1, offset: 0.2 }, { rotate: "0deg", scale: 1.1, offset: 0.6 }, { rotate: "360deg", scale: 1 }],
        { duration: 4200, easing: COURBES.smooth, fill: "both" });
      forme.parentElement.animate([{ filter: "hue-rotate(0deg)" }, { filter: "hue-rotate(360deg)" }], { duration: 4200, fill: "both" });
    },
    labo(s) {
      const labo = s.querySelector("#labo");
      const couleurs = { linear: "#60A5FA", smooth: "#A78BFA", back: "#F472B6", spring: "#E9B44C", bounce: "#4ECDC4" };
      // La courbe de chaque caractère, dessinée à côté de sa bille.
      const trace = (nom) => {
        const f = { linear: (t) => t, smooth: (t) => (t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2),
          back: (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2,
          spring: (t) => 1 - Math.exp(-6 * t) * Math.cos(12 * t), bounce: (t) => { const n = 7.5625, d = 2.75;
            if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; } }[nom];
        return Array.from({ length: 41 }, (_, i) => `${i ? "L" : "M"}${(i / 40) * 70},${44 - f(i / 40) * 36}`).join(" ");
      };
      labo.innerHTML = Object.keys(couleurs).map((nom) => `<code>${nom}</code><svg viewBox="0 0 70 44"><path d="${trace(nom)}" fill="none" stroke="${couleurs[nom]}" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><div class="piste"><div class="bille" style="color:${couleurs[nom]}"></div></div>`).join("");
      labo.querySelectorAll("path").forEach((p, i) => p.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 700, delay: i * 90, easing: COURBES.out, fill: "both" }));
      labo.querySelectorAll(".bille").forEach((b, i) => {
        const nom = Object.keys(couleurs)[i];
        const piste = b.parentElement.clientWidth - 28;
        b.animate([{ translate: "0 0", scale: "1 1" }, { translate: `${piste}px 0`, scale: "1 1" }], { duration: 1600, delay: 300, easing: COURBES[nom], fill: "both" });
        // Étirement dans le sens du mouvement : squash & stretch.
        b.animate([{ scale: "1 1" }, { scale: "1.5 .7", offset: 0.3 }, { scale: "1 1" }], { duration: 1600, delay: 300, easing: "ease-in-out", composite: "add" });
      });
      s.querySelector("p").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 800, delay: 2200, fill: "both" });
    },
    cube(s) {
      const cube = s.querySelector("#cube");
      cube.animate([{ transform: "scale(0) rotateX(-30deg) rotateY(0deg)" }, { transform: "scale(1) rotateX(-20deg) rotateY(45deg)", offset: 0.25 },
        { transform: "scale(1) rotateX(340deg) rotateY(405deg)" }], { duration: 4300, easing: COURBES.smooth, fill: "both" });
    },
    fin(s) {
      lettres(s.querySelector(".titre"), [{ opacity: 0, scale: 0.4, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0)" }], { ecart: 0.06, duree: 0.9, courbe: COURBES.back });
      s.querySelector(".legende").animate([{ opacity: 0, translate: "0 20px" }, { opacity: 1, translate: "0 0" }], { duration: 700, delay: 900, easing: COURBES.out, fill: "both" });
      s.querySelector(".engage").animate([{ opacity: 0, scale: 0 }, { opacity: 1, scale: 1 }], { duration: 800, delay: 1600, easing: RESSORT, fill: "both" });
      // Le compteur : de 0 à 0 bibliothèque, pour le clin d'œil — puis le nombre de scènes.
      const compteur = s.querySelector("#compteur");
      compteur.textContent = "0";
    },
  };

  // Un bouton qu'on a envie de toucher : il suit un peu la souris.
  const engage = document.getElementById("engage");
  engage.addEventListener("pointermove", (e) => {
    const r = engage.getBoundingClientRect();
    engage.style.translate = `${(e.clientX - r.left - r.width / 2) * 0.25}px ${(e.clientY - r.top - r.height / 2) * 0.35}px`;
  });
  engage.addEventListener("pointerleave", () => { engage.style.translate = "0 0"; });

  // La profondeur suit la souris, doucement.
  const plateau = document.getElementById("plateau");
  addEventListener("pointermove", () => { plateau.style.transform = `rotateY(${souris.x * 10}deg) rotateX(${-souris.y * 8}deg)`; });

  // ——— Le chef d'orchestre ———————————————————————————————————————————————————————
  const scenes = [...document.querySelectorAll(".scene")];
  async function tourner() {
    if (calme) return;
    for (;;) {
      for (const s of scenes) {
        const duree = Number(s.dataset.duree) * 1000;
        s.getAnimations({ subtree: true }).forEach((a) => a.cancel());
        s.classList.add("active");
        s.animate([{ opacity: 0 }, { opacity: 1, offset: 400 / duree }, { opacity: 1, offset: 1 - 400 / duree }, { opacity: 0 }], { duration: duree, fill: "both" });
        JOUER[s.dataset.nom](s);
        await attendre(duree);
        s.classList.remove("active");
      }
    }
  }
  tourner();
</script>
</body>
</html>
