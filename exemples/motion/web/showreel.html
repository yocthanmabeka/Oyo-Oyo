<!doctype html>
<!-- Le showreel de Claude, en HTML et CSS : le jumeau exact de ../holocode/showreel.holo.
     Mêmes sept scènes, mêmes formes, mêmes couleurs, mêmes moments, mêmes durées, mêmes courbes.
     Le JavaScript ne sert qu'à deux choses que CSS ne sait pas faire seul : couper un texte en
     lettres, et relancer le film à la fin.
     La version qui va plus loin que HoloCode (particules, morphing libre, cube, souris) est à
     côté : showreel-max.html. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude — Motion Showreel</title>
<style>
  :root {
    --linear: linear;
    --smooth: cubic-bezier(.65,0,.35,1);
    --out: cubic-bezier(.16,1,.3,1);
    --back: cubic-bezier(.34,1.56,.64,1);
    --spring: linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);
    --bounce: linear(0,.004,.016,.035,.063,.098,.141 13.6%,.25,.391,.563,.765,1,.891 40.9%,.848,.813,.785,.766,.754,.75,.754,.766,.785,.813,.848,.891 68.2%,1 72.7%,.973,.953,.941,.938,.941,.953,.973,1,.988,.984,.988,1);
  }
  body { margin: 0; min-height: 100vh; background: #05050c; color: white; font-family: "Inter", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }

  /* Les scènes : l'une après l'autre, au même endroit. */
  .scenes { position: relative; overflow: hidden; height: 640px; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; opacity: 0; padding: 16px; box-sizing: border-box; }
  .scene > * { margin: 0; }
  .joue .scene { animation: var(--apparition) var(--duree) linear var(--debut) both; }
  @keyframes scene4  { 0% { opacity: 0; visibility: visible } 10%    { opacity: 1 } 90%    { opacity: 1 } 100% { opacity: 0; visibility: hidden } }
  @keyframes scene45 { 0% { opacity: 0; visibility: visible } 8.889% { opacity: 1 } 91.111% { opacity: 1 } 100% { opacity: 0; visibility: hidden } }
  @keyframes scene5  { 0% { opacity: 0; visibility: visible } 8%     { opacity: 1 } 92%    { opacity: 1 } 100% { opacity: 0; visibility: hidden } }

  /* Une entrée : le bloc part de la pose écrite dans ses variables, et arrive à sa place. */
  .entre, .lettre { display: block; }
  .joue .entre { animation: entre var(--t, .8s) var(--e, var(--out)) calc(var(--debut) + var(--d, 0s)) both; }
  @keyframes entre {
    from { opacity: var(--o, 1); translate: var(--x, 0px) var(--y, 0px); scale: var(--s, 1); rotate: var(--r, 0deg);
      transform: perspective(800px) rotateY(var(--f, 0deg)); filter: blur(var(--b, 0px)); }
  }
  /* Lettre après lettre : la même entrée, décalée par lettre. */
  .mot { display: inline-block; white-space: nowrap; }
  .lettre { display: inline-block; }
  .joue .lettres .lettre { animation: entre var(--t, .8s) var(--e, var(--out)) calc(var(--debut) + var(--d, 0s) + var(--i) * var(--pas)) both; }
  .joue .lettres { animation: none; }
  /* Enfant après enfant. */
  .joue .chacun { animation: none; }
  .joue .chacun > * > * { animation: entre var(--t, .8s) var(--e, var(--out)) calc(var(--debut) + var(--d, 0s) + var(--rang) * var(--pas)) both; }
  .chacun > * > :nth-child(2) { --rang: 1; } .chacun > * > :nth-child(3) { --rang: 2; } .chacun > * > :nth-child(4) { --rang: 3; }
  .chacun > * > * { --rang: 0; }

  /* Une boucle : le bloc va vers la pose écrite, et revient, sans fin. */
  .vit { display: block; }
  .joue .vit { animation: vit var(--lt, 1s) var(--le, var(--smooth)) calc(var(--debut) + var(--ld, 0s)) infinite var(--sens, alternate) both; }
  @keyframes vit {
    to { scale: var(--ls, 1); translate: var(--lx, 0px) var(--ly, 0px); rotate: var(--lr, 0deg); filter: hue-rotate(var(--lh, 0deg));
      border-radius: var(--lround, 0%); transform: perspective(800px) rotateX(var(--ltilt, 0deg)) rotateY(var(--lflip, 0deg)); }
  }
  .arrondit { overflow: hidden; }

  /* Le plateau du Big Bang : 640 × 360, qui garde ses proportions. */
  .plateau { position: relative; overflow: hidden; border-radius: 12px; container-type: inline-size; aspect-ratio: 640 / 360; width: min(100%, 142.2vh); }
  .place { position: absolute; left: calc(var(--px) * 1%); top: calc(var(--py) * 1%); translate: calc(var(--px) * -1%) calc(var(--py) * -1%); }
  .forme { width: var(--taille, calc(var(--n) * 100cqw / 640)); height: var(--taille, calc(var(--n) * 100cqw / 640)); background: var(--c); }
  .circle { border-radius: 50%; }
  .diamond { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .point { width: 10cqw; height: 10cqw; border-radius: 50%; background: radial-gradient(circle, white 0%, #FFE9A8 35%, transparent 70%); }

  .ligne { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; }
  .colonne { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }

  .title { font-size: 96px; font-weight: bold; color: #FFE9A8; margin: 0; }
  .role { font-size: 26px; font-weight: normal; color: #9aa4c7; margin: 0; }
  .word { font-size: 72px; font-weight: bold; color: white; margin: 0; }
  .word2 { font-size: 72px; font-weight: bold; color: #4ECDC4; margin: 0; }
  .word3 { font-size: 72px; font-weight: bold; color: #F472B6; margin: 0; }
  .legend { font-size: 20px; color: #9aa4c7; }
  .label { font-family: ui-monospace, Consolas, monospace; font-size: 15px; color: #9aa4c7; width: 80px; }
  .card { background: #141428; border: 1px solid #E9B44C; border-radius: 14px; padding: 22px 26px; font-size: 20px; font-weight: bold; }
  .hire { font-size: 34px; font-weight: bold; color: #05050c; background: #E9B44C; border-radius: 40px; padding: 12px 34px; }
  hr { width: 320px; color: #E9B44C; border: 0; border-top: 1px solid currentColor; opacity: .4; height: 0; }

  @media (prefers-reduced-motion: reduce) {
    .joue *, .joue .scene { animation: none !important; }
    .scene { opacity: 0; visibility: hidden; }
    .scene:last-child { opacity: 1; visibility: visible; }
  }
</style>
</head>

          <div class="place" style="--px:31;--py:40"><div class="vit" style="--ls:1.6;--lt:0.5s"><div class="entre" style="--x:115px;--y:34px;--s:0;--o:0;--d:1.43s;--t:1.1s"><div class="forme circle" style="--c:#4ECDC4;--n:8"></div></div></div></div>

        <div class="ligne" style="gap: 16px"><div class="label">linear</div><div class="entre" style="--x:-260px;--d:.3s;--t:1.6s;--e:var(--linear)"><div class="forme circle" style="--c:#60A5FA;--taille:28px"></div></div></div>
        <div class="ligne" style="gap: 16px"><div class="label">smooth</div><div class="entre" style="--x:-260px;--d:.3s;--t:1.6s;--e:var(--smooth)"><div class="forme circle" style="--c:#A78BFA;--taille:28px"></div></div></div>
        <div class="ligne" style="gap: 16px"><div class="label">back</div><div class="entre" style="--x:-260px;--d:.3s;--t:1.6s;--e:var(--back)"><div class="forme circle" style="--c:#F472B6;--taille:28px"></div></div></div>
        <div class="ligne" style="gap: 16px"><div class="label">spring</div><div class="entre" style="--x:-260px;--d:.3s;--t:1.6s;--e:var(--spring)"><div class="forme circle" style="--c:#E9B44C;--taille:28px"></div></div></div>
        <div class="ligne" style="gap: 16px"><div class="label">bounce</div><div class="entre" style="--y:-120px;--d:.3s;--t:1.6s;--e:var(--bounce)"><div class="forme circle" style="--c:#4ECDC4;--taille:28px"></div></div></div>
      </div>
      <div class="entre legend" style="--o:0;--d:2.2s">Le mouvement a un caractère.</div>
    </section>

    <!-- 6. La profondeur : des cartes qui se retournent, l'une après l'autre. -->
    <section class="scene" style="--apparition: scene45; --duree: 4.5s; --debut: 22.5s">
      <div class="chacun" style="--f:-100deg;--o:0;--pas:.18s;--t:.9s;--e:var(--back)">
        <div class="ligne" style="gap: 18px">
          <div class="card">Rust</div>
          <div class="card">WebGPU</div>
          <div class="card">HoloCode</div>
          <div class="card">Big Bang</div>
        </div>
      </div>
      <div class="vit" style="--ltilt:180deg;--lflip:180deg;--lt:1.6s;--le:var(--linear);--sens:normal"><div class="entre" style="--s:0;--d:1s;--e:var(--spring)"><div class="forme diamond" style="--c:#A78BFA;--taille:70px"></div></div></div>
    </section>

    <!-- 7. La fin : la signature. -->
    <section class="scene" style="--apparition: scene45; --duree: 4.5s; --debut: 27s">
      <h1 class="title lettres" style="--s:.4;--o:0;--b:16px;--pas:.06s;--t:.9s;--e:var(--back)">Holoverse</h1>
      <div class="entre legend" style="--y:20px;--o:0;--d:.9s;--t:.7s">Fait en HTML et CSS · 7 lignes de JavaScript</div>
      <div class="vit" style="--ls:1.08;--lt:.6s;--ld:1.6s"><div class="entre hire" style="--s:0;--o:0;--d:1.6s;--t:.8s;--e:var(--spring)">Engagez-moi.</div></div>
    </section>

  </div>
</main>
<script>
  // Couper chaque titre « lettres » en lettres, chacune avec son rang (--i), sans casser les mots.
  for (const titre of document.querySelectorAll(".lettres")) {
    let rang = 0;
    titre.innerHTML = titre.textContent.split(" ").map((mot) =>
      `<span class="mot">${[...mot].map((c) => `<span class="lettre" style="--i:${rang++}">${c}</span>`).join("")}</span>`).join(" ");
  }
  // Relancer le film à la fin : on retire la classe qui joue, puis on la remet.
  const film = document.getElementById("film");
  setInterval(() => { film.classList.remove("joue"); void film.offsetWidth; film.classList.add("joue"); }, 31500);
</script>
</body>
</html>
