<!doctype html>
<!-- Porte d'entrée « vue points » d'un fichier .holo : adresse du fichier, suivie de ?vue=points.

     Le moteur fabrique la page du fichier, puis on en tire les pixels, et chaque pixel devient
     un point. Au repos on voit la page ordinaire. En zoomant, les pixels grossissent,
     deviennent des points lumineux bien rangés, puis chaque point se morcelle en une grille
     de points. En tournant la page, on la voit de biais, et ce qui est lumineux se soulève.

     Chrome ne donne pas directement les pixels d'une page : on la redessine dans une image
     (un SVG qui contient la page), ce qui marche parce que c'est le moteur qui l'a fabriquée.
     Dans cette vue, la page est une image : ses boutons ne répondent pas. -->
<html lang="fr"><head><meta charset="utf-8"><title>HoloCode</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
  #image{position:fixed;left:0;top:0;transform-origin:0 0;pointer-events:none;will-change:transform,opacity}
  #etat{position:fixed;left:8px;bottom:8px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.6);color:#bbb;
    font:12px system-ui,sans-serif;pointer-events:none}
  #commandes{position:fixed;right:8px;bottom:8px;display:flex;gap:8px}
  #commandes button,#web{padding:8px 12px;border:1px solid #888;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;
    font:14px system-ui,sans-serif;cursor:pointer;text-decoration:none}
  #commandes button[aria-pressed="true"]{border-color:#E9B44C;color:#E9B44C}
  #web{position:fixed;top:8px;right:8px}
  #erreur{position:fixed;left:8px;top:8px;right:8px;color:#f88;font:13px monospace;white-space:pre-wrap}
</style>
</head><body><canvas id="monde"></canvas><img id="image" alt=""><div id="etat"></div>
<a id="web" href="?">Vue web</a>
<div id="commandes">
  <button id="tourner" type="button" aria-pressed="false" title="Glisser fait tourner la page (ou : bouton droit, ou Maj)">Tourner</button>
  <button id="face" type="button" title="Remettre la page de face">De face</button>
</div>
<script type="module">
  import init, { vue_a_plat, demarrer_mosaique, mosaique_camera, mosaique_tourner, mosaique_pivoter, mosaique_de_face } from "/pkg/holo_moteur.js";
  const params = new URLSearchParams(location.search);
  const chemin = location.pathname;
  const base = chemin.slice(0, chemin.lastIndexOf("/") + 1);
  const image = document.getElementById("image");
  const etat = document.getElementById("etat");
  const boutonTourner = document.getElementById("tourner");
  const nombre = new Intl.NumberFormat("fr-FR");
  // Deux points par pixel de l'écran dans chaque sens : les lettres sont plus fines.
  const DENSITE = 2;

  const enAdresse = (blob) => new Promise((ok, raté) => {
    const lecteur = new FileReader();
    lecteur.onload = () => ok(lecteur.result);
    lecteur.onerror = raté;
    lecteur.readAsDataURL(blob);
  });

  // La page du fichier, redessinée dans une image aux dimensions de la fenêtre.
  async function imageDeLaPage(source) {
    const conteneur = document.createElement("div");
    conteneur.innerHTML = vue_a_plat(source, base);
    document.title = conteneur.querySelector(".holo-Page")?.dataset.title || "HoloCode";
    // Une image ne peut pas aller chercher d'autres fichiers : celles de la page sont copiées dedans.
    for (const img of conteneur.querySelectorAll("img")) {
      img.setAttribute("src", await enAdresse(await (await fetch(img.src)).blob()));
    }
    const [l, h] = [innerWidth, innerHeight];
    const page = new XMLSerializer().serializeToString(conteneur);
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${l * DENSITE}" height="${h * DENSITE}" viewBox="0 0 ${l} ${h}">` +
      `<foreignObject width="${l}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${l}px;height:${h}px;overflow:hidden">` +
      `<style>.holo-Page{min-height:${h}px!important}</style>${page}</div></foreignObject></svg>`;
    image.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    await image.decode();
    const toile = new OffscreenCanvas(l * DENSITE, h * DENSITE);
    const dessin = toile.getContext("2d");
    dessin.drawImage(image, 0, 0, toile.width, toile.height);
    image.style.width = `${toile.width}px`;
    image.style.height = `${toile.height}px`;
    return dessin.getImageData(0, 0, toile.width, toile.height);
  }

  function suivre() {
    const camera = mosaique_camera();
    if (camera.length) {
      const [cx, cy, echelle, opacite, niveau, points, lacet, tangage, distance] = camera;
      // La page ordinaire suit la même vue, de face comme de biais, et s'efface quand les
      // points prennent le relais.
      image.style.transform =
        `translate(${innerWidth / 2}px,${innerHeight / 2}px) perspective(${distance}px) rotateX(${tangage}rad) rotateY(${lacet}rad) ` +
        `translate(${-cx * echelle}px,${-cy * echelle}px) scale(${echelle})`;
      image.style.opacity = 1 - opacite;
      etat.textContent = opacite === 0
        ? `${nombre.format(innerWidth * DENSITE * innerHeight * DENSITE)} points — zoomez`
        : `${nombre.format(points)} points à l'écran · morcelés ${niveau} fois`;
    }
    requestAnimationFrame(suivre);
  }

  try {
    await init();
    const source = await (await fetch(chemin, { headers: { accept: "text/plain" } })).text();
    const pixels = await imageDeLaPage(source);
    await demarrer_mosaique(document.getElementById("monde"), new Uint8Array(pixels.data.buffer), pixels.width, pixels.height);
    // Le bouton droit sert à tourner la page : pas de menu.
    addEventListener("contextmenu", (evenement) => evenement.preventDefault());
    boutonTourner.addEventListener("click", () => {
      const actif = boutonTourner.getAttribute("aria-pressed") !== "true";
      boutonTourner.setAttribute("aria-pressed", String(actif));
      mosaique_tourner(actif);
    });
    document.getElementById("face").addEventListener("click", () => mosaique_de_face());
    // Pour les captures d'écran : &zoom=…&x=…&y=… (comme la molette à cet endroit),
    // &lacet=…&tangage=… (en degrés).
    if (params.get("zoom")) {
      document.querySelector("canvas").dispatchEvent(new WheelEvent("wheel", {
        deltaY: -Math.log2(Number(params.get("zoom"))) / 0.003,
        clientX: Number(params.get("x") ?? innerWidth / 2), clientY: Number(params.get("y") ?? innerHeight / 2), cancelable: true,
      }));
    }
    mosaique_pivoter(Number(params.get("lacet") ?? 0) * Math.PI / 180, Number(params.get("tangage") ?? 0) * Math.PI / 180);
    requestAnimationFrame(suivre);
  } catch (e) {
    const pre = document.body.appendChild(document.createElement("pre"));
    pre.id = "erreur";
    pre.textContent = "Le moteur a refusé ce fichier : " + (e?.message ?? e);
  }
</script>
</body></html>
