<!doctype html>
<!-- Porte d'entrée pour une page : identique pour tous les fichiers .holo.

     On est d'abord devant un site web normal, fabriqué par le moteur (vue à plat).
     - Zoomer (Ctrl + molette, ou pincer) : les pixels de la page grossissent et deviennent
       des points lumineux bien rangés, qui se morcellent ensuite sans fin. C'est la même
       page, vue de plus près. Dézoomer jusqu'au bout ramène au site normal.
     - Tourner la page : on la voit de biais, et ce qui est lumineux se soulève.
     - Vue personnage : la page est posée comme une feuille dans un monde.
     - Entrer dans un point ouvre son monde, avec son contenu lisible sur un panneau.

     Cette page ne décide de rien : chaque toucher est envoyé au moteur, qui répond par les
     effets que les règles du fichier demandent (ADR-015). -->
<html lang="fr"><head><meta charset="utf-8"><title>HoloCode</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;background:#000}
  canvas.holo-profondeur{position:fixed;inset:0;width:100vw;height:100vh;display:none;touch-action:none;z-index:0}
  .avec-monde>canvas.holo-profondeur{display:block}
  .holo-Page>main{position:relative;z-index:1}
  /* Le site contenu dans un point : une feuille posée dans le monde de ce point, comme la
     page en vue personnage. On est dans un point, donc on le voit en personnage. */
  .holo-World{position:fixed;inset:auto;left:50%;top:50%;width:420px;height:640px;box-sizing:border-box;overflow:auto;
    padding:24px 16px;background:#111;color:#fff;border-radius:16px;box-shadow:0 0 40px rgba(255,255,255,.18);
    pointer-events:auto;z-index:2;transform:translate(-50%,-50%);transform-origin:center;backface-visibility:hidden;
    will-change:transform}
  .holo-World .holo-panneau{position:static;max-height:none;overflow:visible;padding:0;background:none}
  /* Vue personnage : la page devient une feuille posée dans le monde. */
  .mode-personnage{height:100vh;overflow:hidden}
  .mode-personnage>main{position:fixed;left:50%;top:50%;width:420px;height:640px;box-sizing:border-box;overflow:auto;
    background:inherit;padding:inherit;border-radius:16px;box-shadow:0 0 40px rgba(233,180,76,.25);
    transform:translate(-50%,-50%);transform-origin:center;backface-visibility:hidden;will-change:transform}
  /* Vue points : l'image de la page suit la vue, et s'efface quand les points prennent le relais. */
  #image{position:fixed;left:0;top:0;z-index:3;transform-origin:0 0;pointer-events:none;display:none;will-change:transform,opacity}
  .en-points{overflow:hidden}
  .en-points #image{display:block}
  #etat,#commandes{display:none}
  .en-points #etat{display:block;position:fixed;left:8px;bottom:8px;z-index:5;padding:4px 8px;border-radius:6px;
    background:rgba(0,0,0,.6);color:#bbb;font:12px system-ui,sans-serif;pointer-events:none}
  .en-points #commandes{display:flex;position:fixed;right:8px;bottom:8px;z-index:5;gap:8px}
  .en-points #mode{display:none}
  #vues{position:fixed;top:8px;right:8px;z-index:5;display:flex;gap:8px}
  #vues[hidden]{display:none}
  #vues button,#commandes button{padding:8px 12px;border:1px solid #888;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;
    font:14px system-ui,sans-serif;cursor:pointer}
  #commandes button[aria-pressed="true"]{border-color:#E9B44C;color:#E9B44C}
  #erreur{position:fixed;left:8px;bottom:8px;right:8px;z-index:6;color:#f88;font:13px monospace;white-space:pre-wrap}
</style>
</head><body><div id="page"></div>
<img id="image" alt=""><div id="etat"></div>
<div id="vues" hidden>
  <button id="points" type="button" title="Ou : Ctrl + molette, ou pincer, directement sur la page">Vue points</button>
  <button id="mode" type="button">Vue personnage</button>
</div>
<div id="commandes">
  <button id="tourner" type="button" aria-pressed="false" title="Glisser fait tourner la page (ou : bouton droit, ou Maj)">Tourner</button>
  <button id="face" type="button" title="Remettre la page de face">De face</button>
</div>
<script type="module">
  import init, {
    demarrer, changer_de_monde, pause, surface, vue_a_plat, effets, source_du_point, monde_d_accueil,
    demarrer_mosaique, poser_mosaique, retirer_mosaique, mosaique_camera, mosaique_tourner, mosaique_pivoter, mosaique_de_face, mosaique_sous, reglages_de_vue, reveiller, images_dessinees,
  } from "/pkg/holo_moteur.js";
  window.__holoPause = pause;
  window.__holoImages = images_dessinees; // combien d'images le moteur a dessinées : pour vérifier la sobriété
  const params = new URLSearchParams(location.search);
  // L'adresse est celle du fichier .holo lui-même ; sinon ?monde=… ou la boutique d'exemple.
  const chemin = location.pathname.endsWith(".holo") ? location.pathname : params.get("monde") ?? "/exemples/boutique-comparee/boutique.holo";
  const base = chemin.slice(0, chemin.lastIndexOf("/") + 1);
  const racine = document.getElementById("page");
  const boutonMode = document.getElementById("mode");
  const boutonPoints = document.getElementById("points");
  const boutonTourner = document.getElementById("tourner");
  const image = document.getElementById("image");
  const etat = document.getElementById("etat");
  const nombre = new Intl.NumberFormat("fr-FR");
  // La feuille mesure 2 unités de haut dans le monde, dont les points sont sur une sphère de rayon 1.
  const HAUTEUR_FEUILLE_MONDE = 2;
  const HAUTEUR_FEUILLE_PX = 640;
  // Vue points : ce que le fichier en dit (Zoom, Points). Lu au démarrage.
  let densite = 2;          // points par pixel d'écran, dans chaque sens
  let reduire = false;      // dézoomer réduit-il la page jusqu'à un point ?
  let source = "";
  let cadre = null;         // l'élément .holo-Page
  let page = null;          // son contenu, <main>
  let moteurLance = false;
  let personnage = false;   // vue personnage ou vue web
  let dansLePoint = null;   // le point dans lequel on est entré
  let enPoints = false;     // la page est vue comme un ensemble de points
  let entreeEnCours = null; // l'entrée en vue points, tant qu'elle se prépare
  let aQuitteLeRepos = false; // a-t-on zoomé ou tourné depuis l'entrée en vue points ?
  let feuille = null;       // ce qui est posé dans le monde affiché : la page, ou le site d'un point
  let pixelsPlantes = [];   // les points plantés dans un pixel de la page, et où ils sont

  // La zone de dessin du moteur : une seule, pour les mondes comme pour les points.
  function zoneDeDessin() {
    let canvas = cadre.querySelector("canvas");
    if (!canvas) {
      canvas = document.createElement("canvas");
      cadre.prepend(canvas);
    }
    canvas.classList.add("holo-profondeur");
    return canvas;
  }

  // Montre la vue en profondeur d'un point (un fichier .holo réduit à ce point).
  async function montrerMonde(sourceDuPoint, zoom) {
    cadre.classList.add("avec-monde");
    if (!moteurLance) {
      moteurLance = true;
      await demarrer(zoneDeDessin(), sourceDuPoint, zoom);
      zoneDeDessin(); // si la carte graphique a exigé une nouvelle zone, elle garde la même place
    } else {
      changer_de_monde(sourceDuPoint, zoom);
      pause(false);
    }
  }

  function cacherMonde() {
    cadre.classList.remove("avec-monde");
    if (moteurLance) pause(true);
  }

  // ---------------------------------------------------------------- vue personnage

  // La feuille suit le monde, comme un objet qu'on y aurait posé.
  let feuilleSuivie = false;

  function poserLaFeuille() {
    feuilleSuivie = false;
    if (!feuille) return;
    const s = surface();
    if (s.length) {
      const [x, y, echelle, lacet, tangage, profondeur, distance] = s;
      const demiHauteur = innerHeight / 2;
      const unite = echelle * demiHauteur; // pixels pour une unité du monde
      const f = (unite * HAUTEUR_FEUILLE_MONDE) / HAUTEUR_FEUILLE_PX;
      // Plongé dans un point né de la graine, on a quitté le lieu où se trouve la feuille.
      feuille.style.visibility = profondeur > 0 ? "hidden" : "visible";
      feuille.style.transform =
        `translate(-50%,-50%) translate(${x * demiHauteur}px,${-y * demiHauteur}px) ` +
        `perspective(${distance * unite}px) rotateX(${tangage}rad) rotateY(${-lacet}rad) scale(${f})`;
    }
    feuilleSuivie = true;
    requestAnimationFrame(poserLaFeuille);
  }

  // Pose un élément dans le monde affiché (ou plus rien, avec null).
  function poser(element) {
    if (feuille && feuille !== element) {
      feuille.style.transform = "";
      feuille.style.visibility = "visible";
    }
    feuille = element;
    if (feuille && !feuilleSuivie) {
      feuilleSuivie = true;
      requestAnimationFrame(poserLaFeuille);
    }
  }

  async function changerDeVue(versPersonnage) {
    if (enPoints) sortirDesPoints();
    personnage = versPersonnage;
    boutonMode.textContent = personnage ? "Vue web" : "Vue personnage";
    boutonPoints.hidden = personnage;
    cadre.classList.toggle("mode-personnage", personnage);
    if (dansLePoint) return;
    if (personnage) {
      await montrerMonde(monde_d_accueil(source), 1);
      poser(page);
    } else {
      poser(null);
      cacherMonde();
    }
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- vue points

  const enAdresse = (blob) => new Promise((ok, raté) => {
    const lecteur = new FileReader();
    lecteur.onload = () => ok(lecteur.result);
    lecteur.onerror = raté;
    lecteur.readAsDataURL(blob);
  });

  // La page telle qu'on la voit, redessinée dans une image aux dimensions de la fenêtre.
  // Chrome ne donne pas les pixels d'une page ; mais celle-ci, c'est le moteur qui l'a
  // fabriquée : on peut la remettre dans une image (un SVG qui la contient).
  async function imageDeLaPage() {
    const copie = racine.cloneNode(true);
    copie.querySelectorAll("canvas").forEach((c) => c.remove());
    // Une image ne peut pas aller chercher d'autres fichiers : celles de la page sont copiées dedans.
    const originales = racine.querySelectorAll("img");
    for (const [i, img] of [...copie.querySelectorAll("img")].entries()) {
      img.setAttribute("src", await enAdresse(await (await fetch(originales[i].src)).blob()));
    }
    const [l, h] = [innerWidth, innerHeight];
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${l * densite}" height="${h * densite}" viewBox="0 0 ${l} ${h}">` +
      `<foreignObject width="${l}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${l}px;height:${h}px;overflow:hidden">` +
      `<style>.holo-Page{min-height:${h}px!important}</style>` +
      `<div style="margin-top:${-scrollY}px">${new XMLSerializer().serializeToString(copie)}</div></div></foreignObject></svg>`;
    image.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    await image.decode();
    const toile = new OffscreenCanvas(l * densite, h * densite);
    const dessin = toile.getContext("2d");
    dessin.drawImage(image, 0, 0, toile.width, toile.height);
    image.style.width = `${toile.width}px`;
    image.style.height = `${toile.height}px`;
    return dessin.getImageData(0, 0, toile.width, toile.height);
  }

  // Le suivi ne tourne que pendant qu'on bouge : immobile, il s'arrête, comme le moteur.
  let suiviActif = false;
  let derniereCamera = "";
  let imagesImmobiles = 0;

  function reveillerLeSuivi() {
    if (!enPoints) return;
    reveiller();
    imagesImmobiles = 0;
    if (!suiviActif) {
      suiviActif = true;
      requestAnimationFrame(suivreLesPoints);
    }
  }

  function suivreLesPoints() {
    suiviActif = false;
    if (!enPoints) return;
    const camera = mosaique_camera();
    if (camera.length) {
      const [cx, cy, echelle, opacite, niveau, points, lacet, tangage, distance, echelleAuRepos] = camera;
      // Revenu exactement à la page entière, de face : c'est le site normal, on y retourne.
      const auRepos = Math.abs(echelle / echelleAuRepos - 1) < 1e-9 && lacet === 0 && tangage === 0;
      if (auRepos && aQuitteLeRepos) {
        sortirDesPoints();
        return;
      }
      aQuitteLeRepos ||= !auRepos;
      // L'image de la page suit la même vue, de face comme de biais, et s'efface quand les
      // points prennent le relais.
      image.style.transform =
        `translate(${innerWidth / 2}px,${innerHeight / 2}px) perspective(${distance}px) rotateX(${tangage}rad) rotateY(${lacet}rad) ` +
        `translate(${-cx * echelle}px,${-cy * echelle}px) scale(${echelle})`;
      image.style.opacity = 1 - opacite;
      etat.textContent = opacite === 0
        ? `${nombre.format(image.naturalWidth * image.naturalHeight)} points — zoomez`
        : `${nombre.format(points)} points à l'écran · morcelés ${niveau} fois`;
    }
    const cle = camera.join();
    imagesImmobiles = cle === derniereCamera ? imagesImmobiles + 1 : 0;
    derniereCamera = cle;
    if (imagesImmobiles > 6) return; // plus rien ne bouge : on s'arrête jusqu'au prochain geste
    suiviActif = true;
    requestAnimationFrame(suivreLesPoints);
  }

  // Les points plantés dans un pixel de la page : chacun se place juste au-dessus du bloc
  // que son « above » désigne, à l'extrémité droite de la page.
  function placerLesPixels() {
    for (const pixel of racine.querySelectorAll(".holo-pixel")) {
      const repere = racine.querySelector(`[data-name="${CSS.escape(pixel.dataset.above)}"]`);
      if (!repere) continue;
      pixel.style.left = `${page.clientWidth - 1}px`;
      pixel.style.top = `${repere.offsetTop - 6}px`;
    }
  }

  // On zoome vers un endroit de l'écran, comme si on s'en approchait.
  async function approcher(x, y) {
    const canvas = cadre.querySelector("canvas");
    for (let pas = 0; pas < 45 && mosaique_camera()[2] * densite < 280; pas++) {
      canvas.dispatchEvent(new WheelEvent("wheel", { deltaY: -70, clientX: x, clientY: y, cancelable: true }));
      reveillerLeSuivi();
      await new Promise(requestAnimationFrame);
    }
  }

  // En vue points, toucher un point planté par l'auteur l'active : on s'en approche, puis on
  // entre dans le site qu'il contient.
  async function toucherUnPoint(x, y) {
    const sous = mosaique_sous(x, y);
    if (!sous.length) return;
    const tolerance = Math.max(1.5 * densite, 14 / mosaique_camera()[2]);
    const plante = pixelsPlantes.find((p) => Math.abs(p.x - sous[0]) < tolerance && Math.abs(p.y - sous[1]) < tolerance);
    if (!plante) return;
    await approcher(x, y);
    sortirDesPoints();
    for (const effet of effets(source, `${plante.nom}.tap`).split(",").filter(Boolean)) {
      await appliquer(effet);
    }
  }

  // La page devient un ensemble de points, un par pixel. Au départ rien ne change à l'écran :
  // un point fait exactement un pixel.
  function entrerEnPoints() {
    if (enPoints || personnage || dansLePoint) return Promise.resolve();
    entreeEnCours ??= (async () => {
      const pixels = await imageDeLaPage();
      const couleurs = new Uint8Array(pixels.data.buffer);
      pixelsPlantes = [...racine.querySelectorAll(".holo-pixel")].map((pixel) => {
        const cadreDuPixel = pixel.getBoundingClientRect();
        return { nom: pixel.dataset.name, x: (cadreDuPixel.left + cadreDuPixel.width / 2) * densite, y: (cadreDuPixel.top + cadreDuPixel.height / 2) * densite };
      });
      cadre.classList.add("avec-monde");
      if (!moteurLance) {
        moteurLance = true;
        await demarrer_mosaique(zoneDeDessin(), couleurs, pixels.width, pixels.height, source);
        zoneDeDessin();
      } else {
        poser_mosaique(couleurs, pixels.width, pixels.height, source);
        pause(false);
      }
      page.hidden = true;
      document.body.classList.add("en-points");
      boutonPoints.textContent = "Vue web";
      enPoints = true;
      aQuitteLeRepos = false;
      reveillerLeSuivi();
    })().finally(() => { entreeEnCours = null; });
    return entreeEnCours;
  }

  function sortirDesPoints() {
    if (!enPoints) return;
    enPoints = false;
    mosaique_de_face();
    mosaique_tourner(false);
    retirer_mosaique();
    boutonTourner.setAttribute("aria-pressed", "false");
    document.body.classList.remove("en-points");
    boutonPoints.textContent = "Vue points";
    page.hidden = false;
    cacherMonde();
  }

  // Un pincement arrive comme une molette avec Ctrl, par petits pas : on les grossit.
  const pasDeZoom = (evenement) => evenement.deltaY * (Math.abs(evenement.deltaY) < 50 ? 6 : 1);

  // Zoomer sur la page (Ctrl + molette, ou pincer) : c'est le zoom qui fait passer aux points.
  addEventListener("wheel", async (evenement) => {
    // Sinon Chrome grossit ou réduit toute la fenêtre, et le site sort de son cadre.
    if (evenement.ctrlKey) evenement.preventDefault();
    if (enPoints || !evenement.ctrlKey || personnage || dansLePoint || !cadre) return;
    // Garde-fou : on ne dézoome pas en deçà de la page entière, sauf si le fichier le permet
    // (Zoom(shrink: true)).
    if (evenement.deltaY >= 0 && !reduire) return;
    const { clientX, clientY } = evenement;
    const deltaY = pasDeZoom(evenement);
    await entrerEnPoints();
    cadre.querySelector("canvas")?.dispatchEvent(new WheelEvent("wheel", { deltaY, clientX, clientY, cancelable: true }));
  }, { passive: false });

  // ---------------------------------------------------------------- les règles du fichier

  async function appliquer(effet) {
    const [nom, capacite] = effet.split(".");
    const monde = racine.querySelector(`section[data-world="${CSS.escape(nom)}"]`);
    if (!monde) return;
    if (capacite === "enter") {
      dansLePoint = nom;
      page.hidden = true;
      monde.hidden = false;
      document.getElementById("vues").hidden = true;
      // Zoom 1 : le point vient de se morceler, ses enfants entourent la feuille.
      await montrerMonde(source_du_point(source, nom), 1);
      poser(monde);
    } else if (capacite === "leave" && dansLePoint === nom) {
      dansLePoint = null;
      poser(null);
      monde.hidden = true;
      page.hidden = false;
      document.getElementById("vues").hidden = params.has("nu");
      await changerDeVue(personnage);
    }
    window.scrollTo(0, 0);
  }

  try {
    await init();
    source = await (await fetch(chemin, { headers: { accept: "text/plain" } })).text();
    racine.innerHTML = vue_a_plat(source, base);
    [densite, reduire] = reglages_de_vue(source);
    reduire = reduire === 1;
    cadre = racine.querySelector(".holo-Page");
    page = cadre.querySelector("main");
    document.title = cadre.dataset.title || "HoloCode";
    placerLesPixels();
    addEventListener("resize", placerLesPixels);
    // En vue points, un toucher sans glissement active le point planté qui se trouve dessous.
    let appui = null;
    addEventListener("pointerdown", (evenement) => { appui = [evenement.clientX, evenement.clientY]; }, true);
    addEventListener("pointerup", (evenement) => {
      const glissement = appui ? Math.hypot(evenement.clientX - appui[0], evenement.clientY - appui[1]) : Infinity;
      appui = null;
      if (enPoints && glissement < 6 && !evenement.target.closest("button")) toucherUnPoint(evenement.clientX, evenement.clientY);
    }, true);
    racine.addEventListener("click", async (evenement) => {
      const bloc = evenement.target.closest("[data-name]");
      if (!bloc) return;
      for (const effet of effets(source, `${bloc.dataset.name}.tap`).split(",").filter(Boolean)) {
        await appliquer(effet);
      }
    });
    document.getElementById("vues").hidden = params.has("nu"); // ?nu : sans les boutons, pour en tirer une image
    boutonMode.addEventListener("click", () => changerDeVue(!personnage));
    boutonPoints.addEventListener("click", () => (enPoints ? sortirDesPoints() : entrerEnPoints()));
    boutonTourner.addEventListener("click", () => {
      const actif = boutonTourner.getAttribute("aria-pressed") !== "true";
      boutonTourner.setAttribute("aria-pressed", String(actif));
      mosaique_tourner(actif);
    });
    document.getElementById("face").addEventListener("click", () => { mosaique_de_face(); reveillerLeSuivi(); });
    // En vue points, tout geste relance le suivi ; une souris qui passe sans bouton ne compte pas.
    for (const nom of ["wheel", "pointerdown", "pointermove", "pointerup"]) {
      addEventListener(nom, (evenement) => {
        if (nom !== "pointermove" || evenement.buttons !== 0) reveillerLeSuivi();
      }, { capture: true, passive: true });
    }
    addEventListener("resize", reveillerLeSuivi);
    // En vue points, le bouton droit sert à tourner la page : pas de menu.
    addEventListener("contextmenu", (evenement) => { if (enPoints) evenement.preventDefault(); });

    // Pour les captures d'écran : ?vue=personnage, ?entrer=Workshop,
    // ?vue=points avec &zoom=…&x=…&y=… (comme la molette à cet endroit) et &lacet=…&tangage=… (en degrés).
    if (params.get("vue") === "personnage") await changerDeVue(true);
    if (params.get("entrer")) await appliquer(`${params.get("entrer")}.enter`);
    if (params.get("vue") === "points") {
      await entrerEnPoints();
      if (params.get("zoom")) {
        cadre.querySelector("canvas").dispatchEvent(new WheelEvent("wheel", {
          deltaY: -Math.log2(Number(params.get("zoom"))) / 0.003,
          clientX: Number(params.get("x") ?? innerWidth / 2), clientY: Number(params.get("y") ?? innerHeight / 2), cancelable: true,
        }));
      }
      mosaique_pivoter(Number(params.get("lacet") ?? 0) * Math.PI / 180, Number(params.get("tangage") ?? 0) * Math.PI / 180);
      reveillerLeSuivi();
    }
  } catch (e) {
    const pre = document.body.appendChild(document.createElement("pre"));
    pre.id = "erreur";
    pre.textContent = "Le moteur a refusé ce fichier : " + (e?.message ?? e);
  }
</script>
</body></html>
