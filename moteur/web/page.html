<!doctype html>
<!-- Porte d'entrée pour une page : identique pour tous les fichiers .holo.

     On est d'abord devant un site web normal, fabriqué par le moteur (vue à plat).
     - Zoomer (Ctrl + molette, ou pincer) grossit d'abord la page comme n'importe quel site :
       on lit, on sélectionne, on copie. Au-delà du grossissement fixé par le fichier
       (Points(after:)), ses pixels deviennent des points lumineux, qui se morcellent ensuite.
       Dézoomer ramène au site normal.
     - Tourner la page, en vue points : on la voit de biais, et ce qui est lumineux se soulève.
     - Entrer dans un point qui contient un site ouvre le carrefour : des portails vers les
       sites voisins, chacun montrant le site où il mène. Un clic sur un portail l'ouvre en
       grand. Un site peut en contenir d'autres, sans changer de page : la boucle continue.
     - Chaque site a son adresse : le fichier, puis # et le chemin des points traversés.

     Cette page ne décide de rien : chaque toucher est envoyé au moteur, qui répond par les
     effets que les règles du fichier demandent (ADR-015). -->
<html lang="fr"><head><meta charset="utf-8"><title>HoloCode</title>
<!-- minimum-scale=1 : on grossit au doigt autant qu'on veut, mais on ne réduit pas sous la taille
     normale. Sans cela, quand le moteur grossit une page décrochée, Chrome sur téléphone élargit
     sa zone d'affichage, et le menu ☰ (avec « Accrocher ») part hors de l'écran (ADR-069). -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<style>
  /* Par défaut, le zoom est celui du navigateur, comme pour n'importe quel site : la page reste
     à sa place et grossit sur place (ADR-069). Le pincement n'appartient à la page que si
     l'auteur l'a écrit (des points, Zoom(shrink:), Zoom(active: false)) ou si le visiteur l'a
     décrochée : sans cela, Chrome grossirait tout l'écran à sa façon et les pixels ne
     deviendraient jamais des points. On défile toujours avec un doigt. */
  html,body{margin:0}
  .holo-zoom,.holo-zoom body{touch-action:pan-x pan-y}
  /* Décrochée (Zoom(detach: true), puis « Décrocher ») : la page se détache de l'écran, comme
     une feuille ; le zoom l'approche. « Accrocher » la remet à sa place. */
  .detached #page{padding:12px;background:#000}
  .detached #page>.holo-Page{border-radius:12px;box-shadow:0 0 0 2px #E9B44C,0 12px 40px rgba(0,0,0,.6)}
  .in-world #detach,.in-points #detach{display:none}
  /* Les touches à l'écran (ADR-069) : ce qui se fait au clavier se fait aussi au doigt. Sur un
     appareil sans clavier, une page qui écoute des touches les montre en bas de l'écran. */
  #keys{position:fixed;left:12px;right:72px;bottom:12px;z-index:7;display:flex;flex-wrap:wrap;gap:8px}
  #keys[hidden],.in-points #keys,.in-world #keys{display:none}
  #keys button{min-width:48px;min-height:48px;padding:0 12px;border:1px solid #888;border-radius:10px;background:rgba(0,0,0,.72);color:#fff;
    font:600 16px system-ui,sans-serif;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #keys button:active,#keys button.pressed{border-color:#E9B44C;color:#E9B44C}
  #keys button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  /* La zone de dessin du moteur ne sert qu'en vue points. */
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:none;touch-action:none;z-index:1}
  .in-points canvas{display:block}
  /* Vue points : l'image de la page suit la vue, et s'efface quand les points prennent le relais. */
  #image{position:fixed;left:0;top:0;z-index:3;transform-origin:0 0;pointer-events:none;display:none;will-change:transform,opacity}
  .in-points{overflow:hidden}
  .in-points #image{display:block}
  #status,#commands{display:none}
  /* La rotation activée par l'auteur (Relief(tilt:)) : « Tourner » est offert dès la page de face. */
  .rotated #commands{display:flex;flex-direction:column;gap:8px}
  body:not(.in-points) #front,.in-world #commands{display:none}
  .in-points #status{display:block;position:fixed;left:8px;bottom:8px;z-index:5;padding:4px 8px;border-radius:6px;
    background:rgba(0,0,0,.6);color:#bbb;font:12px system-ui,sans-serif;pointer-events:none}

  .in-points #mode{display:none}
  /* Les outils du moteur tiennent dans un seul bouton rond, en bas à droite, posé par-dessus
     le site comme une bulle. On appuie : les outils apparaissent au-dessus de lui, et il
     devient une croix pour les refermer. Le site garde tout l'écran pour lui. */
  #menu{position:fixed;right:12px;bottom:12px;z-index:8;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #menu[hidden],#tools[hidden]{display:none}
  #tools{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:14px;background:rgba(0,0,0,.72);border:1px solid #666}
  #toggle{width:48px;height:48px;padding:0;border-radius:50%;border:1px solid #888;background:rgba(0,0,0,.72);color:#fff;
    font:22px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  #toggle[aria-expanded="true"]{border-color:#E9B44C;color:#E9B44C}
  #toggle:focus-visible{outline:2px solid #fff;outline-offset:2px}
  #views{display:flex;flex-direction:column;gap:8px}
  #views button,#commands button{text-align:left;padding:8px 12px;border:1px solid #888;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;
    font:14px system-ui,sans-serif;cursor:pointer}
  #commands button[aria-pressed="true"],#views button[aria-pressed="true"]{border-color:#E9B44C;color:#E9B44C}
  /* Lu par un lecteur d'écran, invisible à l'écran (ADR-061). */
  .for-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  /* Vue points : la page reste dessous, invisible mais lisible par un lecteur d'écran (ADR-061). */
  .under-points{opacity:0;pointer-events:none}

  /* Un monde calculé, ouvert en profondeur. */
  .in-world canvas{display:block}
  .in-world #page{display:none}
  .in-world #points{display:none}

  /* Le carrefour : des portails vers les mondes voisins, sur le fond du site où l'on est,
     éclairci par une lueur pour qu'on y voie même sur un site sombre (Portals(brightness:)). */
  #crossroads{position:fixed;inset:0;z-index:6;display:flex;gap:36px 44px;padding:64px 32px 32px;box-sizing:border-box;overflow:auto;
    background:radial-gradient(circle at 50% 42%,color-mix(in srgb,#fff var(--glow,15%),var(--background,#000)),var(--background,#000) 85%)}
  #crossroads[hidden]{display:none}
  /* Portals(layout: grid) : en grille, sur toute la fenêtre. */
  #crossroads.grid{flex-wrap:wrap;align-items:center;justify-content:safe center;align-content:safe center}
  /* Portals(layout: row) : une ligne, on défile de gauche à droite. */
  #crossroads.line{flex-wrap:nowrap;align-items:center;overflow-y:hidden}
  /* Portals(layout: column) : une colonne, on défile de haut en bas. */
  #crossroads.column{flex-direction:column;flex-wrap:nowrap;align-items:center;overflow-x:hidden}
  /* Portals(layout: diagonal) : en diagonale, chaque portail un cran plus bas que le précédent. */
  #crossroads.diagonal{flex-wrap:nowrap;align-items:flex-start}
  #crossroads.diagonale .portal{margin-top:calc(var(--rank) * var(--size) * .55)}
  #crossroads .portal{flex:none}
  /* Le passage direct vers un site : le point s'ouvre sur place, au-dessus de la page. */
  #passage{position:fixed;inset:0;z-index:9;pointer-events:none}
  .portal{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0;border:0;background:none;color:inherit;
    font:15px system-ui,sans-serif;cursor:pointer}
  .portal .preview{display:block;position:relative;width:var(--size);height:var(--size);border-radius:50%;overflow:hidden;
    box-shadow:0 0 0 3px var(--color),0 0 28px 6px var(--color);transition:transform .2s,box-shadow .2s}
  /* Là où le curseur se pose, le monde s'avance : il grandit et devient une feuille lisible. */
  .portal:hover{position:relative;z-index:2}
  .portal:hover .preview{transform:scale(1.45);border-radius:16px;box-shadow:0 0 0 3px var(--color),0 0 60px 18px var(--color)}
  .portal:focus-visible .preview{box-shadow:0 0 0 6px #fff,0 0 44px 12px var(--color)}
  /* Un monde calculé : une boule de lumière de sa couleur, avec ses points. */
  .portal .preview.computed{background:
    radial-gradient(circle at 34% 30%,#fff 0 3%,transparent 4%),radial-gradient(circle at 68% 42%,#fff 0 2%,transparent 3%),
    radial-gradient(circle at 46% 70%,#fff 0 2.5%,transparent 3.5%),radial-gradient(circle at 24% 62%,#fff 0 1.5%,transparent 2.5%),
    radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--color) 70%,#fff) 0,var(--color) 38%,color-mix(in srgb,var(--color) 25%,#000) 72%)}
  .portal .content{display:block;position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;text-align:left}
  .portal:focus{outline:none}
  .portal .name{padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff}
  .portal.to .preview{box-shadow:0 0 0 5px var(--color),0 0 60px 16px var(--color)}
  /* Un portail qui s'ouvre : son aperçu grandit jusqu'à remplir la fenêtre, puis devient le site. */
  .preview.opening{position:fixed;z-index:9;box-shadow:none;transition:left var(--duration,.45s) ease-in,top var(--duration,.45s) ease-in,width var(--duration,.45s) ease-in,height var(--duration,.45s) ease-in,border-radius var(--duration,.45s) ease-in}
  .preview.opening .content{transition:transform var(--duration,.45s) ease-in}
  @media (prefers-reduced-motion:reduce){.preview.opening,.preview.opening .content,.portal .preview{transition:none}}

  /* Chez quelqu'un d'autre : un bandeau qui appartient au moteur, pas au site. Un fichier ne
     peut ni le cacher ni le styler : ses styles ne visent que ses propres blocs. */
  #origin{position:fixed;left:8px;top:8px;z-index:9;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;
    background:#111;color:#fff;border:1px solid #E9B44C;font:13px system-ui,sans-serif}
  #origin[hidden]{display:none}
  #origin button{padding:4px 8px;border:1px solid #888;border-radius:6px;background:none;color:#fff;font:inherit;cursor:pointer}
  #error{position:fixed;left:8px;bottom:8px;right:8px;z-index:10;color:#f88;font:13px monospace;white-space:pre-wrap}
  /* Un bouton touché avant l'arrivée du moteur : il montre qu'il attend, tout de suite. */
  .holo-waiting{cursor:progress;animation:holo-waiting .9s ease-in-out infinite alternate}
  @keyframes holo-waiting{to{opacity:.45}}
  @media (prefers-reduced-motion:reduce){.holo-waiting{animation:none;opacity:.6}}
  /* Le moteur n'a pas pu démarrer : la page le dit, sans rien cacher de ce qui se lit. */
  #outage{position:fixed;left:12px;right:76px;bottom:12px;z-index:10;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;
    border-radius:10px;background:#2a1212;color:#ffd6d6;border:1px solid #f88;font:14px system-ui,sans-serif}
  #outage[hidden]{display:none}
  #outage button{padding:6px 12px;border-radius:6px;border:1px solid #ffd6d6;background:none;color:inherit;font:inherit;cursor:pointer}
  /* Sur papier (ADR-073) : seule la page s'imprime, sans les outils du moteur. */
  @media print{#menu,#crossroads,#origin,#outage,#status,#area,#image,#holo-values{display:none!important}}
</style>
</head><body><canvas id="area" aria-hidden="true"></canvas><div id="page"></div>
<img id="image" alt=""><div id="status"></div><div id="announcement" class="for-reader" role="status" aria-live="polite"></div>
<div id="crossroads" hidden></div>
<div id="outage" hidden role="alert"><span>Le moteur n'a pas pu démarrer. La page se lit, mais les boutons ne répondent pas : rien n'a été ajouté ni envoyé.</span><button type="button">Réessayer</button></div>
<div id="origin" hidden><span></span><button type="button">Revenir</button></div>
<div id="keys" role="toolbar" aria-label="Les touches du clavier" hidden></div>
<div id="menu" hidden>
  <div id="tools" hidden>
    <div id="views">
      <button id="points" type="button" title="Ou : Ctrl + molette, ou pincer, directement sur la page">Vue points</button>
      <button id="mode" type="button" title="Les sites voisins, sous forme de portails">Carrefour</button>
      <button id="detach" type="button" hidden title="La page se détache de l'écran : le zoom l'approche comme une feuille">Décrocher</button>
    </div>
    <div id="commands">
      <button id="rotate" type="button" aria-pressed="false" title="Glisser fait tourner la page (ou : bouton droit, ou Maj)">Tourner</button>
      <button id="front" type="button" title="Remettre la page de face">De face</button>
    </div>
  </div>
  <button id="toggle" type="button" aria-expanded="false" aria-controls="tools" aria-label="Ouvrir les outils" title="Les outils du moteur">☰</button>
</div>
<script>
  // Le site léger (ADR-033). La page arrive toute faite par le serveur : on la lit, on défile,
  // on suit un lien vers une autre page, sans rien télécharger d'autre. Le moteur (environ
  // 560 Ko) n'est demandé qu'au premier geste qui en a besoin : toucher un bouton nommé, un
  // lien vers un point, un champ, le menu, ou zoomer. Ce qui a été touché en l'attendant est
  // rejoué. Une page vivante (horloge, clavier, données, glissement) le demande tout de suite,
  // comme une page que le serveur n'a pas fabriquée, ou qui a des valeurs gardées à remettre.
  (() => {
    const root = document.getElementById("page");
    const toggle = document.getElementById("toggle");
    // Une page de holo serve (ADR-074) : avec JavaScript, ses boutons et ses champs quittent le
    // formulaire des gestes et redeviennent ceux de la page ; le moteur les prend comme ailleurs,
    // jusqu'à la touche Entrée d'un `Form`, qui l'envoie.
    for (const field of root.querySelectorAll('[form="holo-gestures"]')) {
      if (field.type === "hidden") field.remove();
      else {
        field.removeAttribute("form");
        if (field.type === "submit") field.type = "button";
      }
    }
    // Ce qui entre quand on le voit (Enter(inView: true), ADR-061) : son mouvement attend que le
    // bloc arrive à l'écran. Sans JavaScript, rien n'attend : tout se voit d'emblée.
    document.documentElement.classList.add("holo-js");
    const watcher = "IntersectionObserver" in window && new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        entry.target.classList.add("holo-seen");
        watcher.unobserve(entry.target);
      }
    }, { rootMargin: "0px 0px -10% 0px" });
    // La place que reçoit un bloc (ADR-069) : une case de grille, ou une part d'un Row ou d'un
    // Column (ADR-090), de moins de 20rem (320px) est marquée « holo-narrow », et les styles
    // « narrow: { … } » s'y appliquent, à la case comme à ce qu'elle contient. Mesuré après la
    // mise en page et avant le dessin : rien ne saute. Seulement si un style de la page le demande.
    const cells = "ResizeObserver" in window && new ResizeObserver((entries) => {
      const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
      for (const entry of entries) {
        const width = entry.borderBoxSize?.[0]?.inlineSize ?? entry.target.offsetWidth;
        entry.target.classList.toggle("holo-narrow", width < 20 * rem);
      }
    });
    // Les cases d'une grille : ses enfants, ou ceux d'un bloc invisible (If, Repeat) posé dedans.
    const gridItems = (parent) => [...parent.children].flatMap((child) => (getComputedStyle(child).display === "contents" ? gridItems(child) : [child]));
    // Dans un Row ou un Column (ADR-090), seulement les cases qui reçoivent une part de la place :
    // grow:, ou une largeur en % dans un style de la page. Un bouton ou un lien qui n'a que la
    // largeur de son texte n'est pas « étroit » pour autant.
    const shares = () => {
      const selectors = [".holo-grow"];
      const visit = (rules) => {
        for (const rule of rules) {
          if (rule.style?.width?.endsWith("%") && /^\.holo-(s-|c-|[A-Z])/.test(rule.selectorText) && !rule.selectorText.includes("holo-narrow")) selectors.push(rule.selectorText);
          // Les règles d'un état (phone: dans un @media), et celles qu'une règle imbrique.
          if (rule.cssRules?.length) visit(rule.cssRules);
        }
      };
      for (const style of root.querySelectorAll("style")) { try { visit(style.sheet?.cssRules ?? []); } catch { /* feuille illisible */ } }
      return selectors.join(",");
    };
    // Aussi après chaque morceau de page fabriqué par le moteur. Et le volume des sons (ADR-061).
    window.__holoWatchEntrances = (inside = root) => {
      for (const block of inside.querySelectorAll(".holo-in-view:not(.holo-seen)")) {
        if (watcher) watcher.observe(block);
        else block.classList.add("holo-seen");
      }
      for (const sound of inside.querySelectorAll("audio[data-volume]")) sound.volume = Number(sound.dataset.volume);
      if (cells && [...root.querySelectorAll("style")].some((style) => style.textContent.includes("holo-narrow"))) {
        for (const grid of inside.querySelectorAll(".holo-Grid")) for (const cell of gridItems(grid)) cells.observe(cell);
        const share = shares();
        for (const line of inside.querySelectorAll(".holo-Row,.holo-Column")) for (const cell of gridItems(line)) if (cell.matches(share)) cells.observe(cell);
      }
    };
    window.__holoWatchEntrances();
    const waiting = (window.__holoWaiting = []);
    const outage = document.getElementById("outage");
    let request = false;
    let test = 0;
    // Plus rien n'attend : les boutons touchés cessent de le montrer.
    const waitingEnd = () => {
      for (const block of root.querySelectorAll(".holo-waiting")) block.classList.remove("holo-waiting");
      root.removeAttribute("aria-busy");
    };
    const load = () => {
      if (request) return;
      request = true;
      outage.hidden = true;
      const engine = document.createElement("script");
      engine.type = "module";
      // Un nouvel essai demande le fichier à nouveau, sans reprendre l'échec gardé en cache.
      engine.src = test ? `/page-engine.js?essai=${test}` : "/page-engine.js";
      engine.onerror = () => window.__holoFailure(false);
      document.body.append(engine);
    };
    // Le moteur n'a pas pu arriver. Les touchers en attente sont oubliés : aucun ne sera rejoué
    // plus tard sans que le visiteur le sache. `relancer` : il faut recharger la page (le module
    // est arrivé, mais pas le WebAssembly).
    window.__holoFailure = (restart) => {
      waiting.length = 0;
      waitingEnd();
      outage.hidden = false;
      outage.querySelector("button").onclick = () => {
        if (restart) return location.reload();
        test += 1;
        request = false;
        load();
      };
    };
    const record = (event) => {
      const block = event.target.closest("[data-name]");
      // Au doigt, toucher un bloc qu'une règle écoute au survol le survole (ADR-039).
      const hovered = event.pointerType === "touch" && event.target.closest("[data-hover]");
      if (hovered) waiting.push(`${hovered.dataset.name}.touch`);
      if (block) {
        // Dans la ligne d'une liste, le toucher garde sa ligne (ADR-044).
        const line = block.closest("[data-rank]")?.dataset.rank;
        waiting.push(line === undefined ? block.dataset.name : `${block.dataset.name}@${line}`);
        block.classList.add("holo-waiting");
        root.setAttribute("aria-busy", "true");
      }
      // Un lien vers un endroit de la page (#Hours) : le navigateur y descend, sans le moteur.
      const anchor = event.target.closest('a[href^="#"]');
      const spot = anchor && document.getElementById(decodeURIComponent(anchor.getAttribute("href").slice(1)));
      if (block || hovered || (anchor && !spot)) load();
    };
    const openMenu = () => { window.__holoMenuRequested = true; load(); };
    // Qui grossit la page quand on zoome (ADR-069) : le navigateur, comme pour n'importe quel
    // site, sauf si le fichier l'a confié au moteur (data-zoom). Une page que le serveur n'a pas
    // fabriquée attend le moteur, qui en décide.
    const byEngine = !!root.querySelector("[data-zoom]") || !root.querySelector("[data-title]");
    document.documentElement.classList.toggle("holo-zoom", byEngine);
    const engineZooms = () => document.documentElement.classList.contains("holo-zoom");
    // Zoomer à la molette, quand c'est le moteur qui grossit : la page à elle, pas le navigateur ;
    // le moteur arrive pour la suite.
    const zoom = (event) => { if (event.ctrlKey && engineZooms()) { event.preventDefault(); load(); } };
    const pinchZoom = (event) => { if (event.touches.length > 1 && engineZooms()) load(); };
    // La souris arrive sur un bloc qu'une règle écoute au survol, ou le clavier s'y pose (ADR-039) :
    // le moteur arrive, et le survol est rejoué s'il dure encore.
    const hover = (event) => {
      if (event.pointerType === "touch") return;
      const block = event.target.closest("[data-hover]");
      if (!block || block.contains(event.relatedTarget)) return;
      const signal = `${block.dataset.name}.${event.type.startsWith("focus") ? "focus" : "hover"}`;
      if (event.type === "pointerover" || event.type === "focusin") {
        if (!waiting.includes(signal)) waiting.push(signal);
        load();
      } else if (waiting.includes(signal)) waiting.splice(waiting.indexOf(signal), 1);
    };
    root.addEventListener("pointerover", hover);
    root.addEventListener("pointerout", hover);
    root.addEventListener("focusin", hover);
    root.addEventListener("focusout", hover);
    root.addEventListener("click", record);
    // Un formulaire ne recharge jamais la page, même avant l'arrivée du moteur (ADR-042). Celui des
    // gestes non plus (ADR-074) : il ne part vers holo serve que si JavaScript manque.
    root.addEventListener("submit", (event) => { if (event.target.closest(".holo-Form") || event.target.id === "holo-gestures") event.preventDefault(); });
    root.addEventListener("focusin", load);
    // Un bouton rond coché, une option choisie : le moteur arrive, et reprend ce choix.
    root.addEventListener("change", load);
    root.addEventListener("input", load);
    toggle.addEventListener("click", openMenu);
    addEventListener("wheel", zoom, { passive: false });
    addEventListener("touchstart", pinchZoom, { passive: true });
    window.__holoStopRecording = () => {
      waitingEnd();
      root.removeEventListener("click", record);
      root.removeEventListener("pointerover", hover);
      root.removeEventListener("pointerout", hover);
      root.removeEventListener("focusin", hover);
      root.removeEventListener("focusout", hover);
      root.removeEventListener("focusin", load);
      root.removeEventListener("change", load);
      root.removeEventListener("input", load);
      toggle.removeEventListener("click", openMenu);
      removeEventListener("wheel", zoom);
      removeEventListener("touchstart", pinchZoom);
    };
    const params = new URLSearchParams(location.search);
    document.getElementById("menu").hidden = params.has("bare");
    // ?moteur : tout de suite, pour mesurer ou comparer. Une adresse avec # ou ? sert aux
    // mondes et aux captures : le moteur aussi.
    const spot = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (!root.querySelector("[data-title]") || root.querySelector("[data-live]") || location.search || (location.hash && !spot)) load();
    // Des valeurs gardées d'une visite précédente (keep) : le moteur les remet. Le visiteur est
    // déjà venu, son navigateur a sans doute gardé le moteur. Elles sont rangées sous l'adresse de
    // la page : un modèle (/profil/{id}.holo) en garde pour chaque adresse qu'il sert (ADR-090).
    try { if (localStorage.getItem(`holo:${location.pathname}`)) load(); } catch { /* stockage refusé */ }
  })();
</script>
</body></html>
