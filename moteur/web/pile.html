<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La pile</title>
<link rel="icon" href="data:,">
<!--
  La pile (demandée par Yocthan le 2026-10-06) : tout ce qui s'ouvre dans le navigateur, le plus
  récent en haut, dans un seul onglet. La page choisie s'ouvre à côté de la liste (sur un
  téléphone : à la place de la liste). Quand Claude veut montrer quelque chose, il le demande au
  serveur (outils/montrer.mjs) : la pile ouverte l'affiche elle-même, sans nouvel onglet ni
  nouvelle fenêtre. Rien ne tourne tant qu'on ne choisit rien : la liste est du texte, et la page
  choisie est arrêtée quand on revient à la liste sur un téléphone.
-->
<style>
  :root {
    color-scheme: dark;
    --fond: #0f1117; --surface: #171a22; --trait: #2a2f3a; --texte: #e8e6e3;
    --doux: #a2a8b2; --accent: #f0b232; --lien: #8cc8ff; --choisi: #232838;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --fond: #f6f5f2; --surface: #ffffff; --trait: #dedbd4; --texte: #1d1d1f;
      --doux: #5f6368; --accent: #8a5a00; --lien: #0b57d0; --choisi: #ece8df;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fond); color: var(--texte);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--trait); background: var(--surface);
  }
  h1 { font-size: 17px; margin: 0; color: var(--accent); }
  #compte { color: var(--doux); font-size: 13px; }
  #chercher {
    flex: 1 1 160px; min-width: 0; max-width: 360px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--trait); background: var(--fond); color: var(--texte); font: inherit;
  }
  header a { color: var(--lien); font-size: 14px; }
  main { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); min-height: 0; }
  #liste { overflow-y: auto; border-right: 1px solid var(--trait); padding: 4px 0 24px; }
  #liste h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--doux);
    margin: 14px 16px 4px;
  }
  #liste a {
    display: block; padding: 7px 16px 7px 13px; color: inherit; text-decoration: none;
    border-left: 3px solid transparent;
  }
  #liste a:hover, #liste a:focus-visible { background: var(--choisi); outline: none; }
  #liste a[aria-current="page"] { background: var(--choisi); border-left-color: var(--accent); }
  .titre { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .detail { display: block; font-size: 12.5px; color: var(--doux); overflow-wrap: anywhere; }
  .nouveau {
    font-size: 11px; font-weight: 700; color: var(--fond); background: var(--accent);
    border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px;
  }
  #vue { display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; }
  #barre {
    display: flex; gap: 12px; align-items: center; padding: 6px 12px; min-height: 40px;
    border-bottom: 1px solid var(--trait);
  }
  #retour { font: inherit; color: var(--lien); background: none; border: 0; padding: 4px 0; cursor: pointer; display: none; }
  #nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--doux); font-size: 13px; }
  #seul { color: var(--lien); font-size: 13px; white-space: nowrap; }
  #seul[hidden] { display: none; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #vide { display: grid; place-items: center; color: var(--doux); padding: 24px; text-align: center; }
  @media (max-width: 760px) {
    main { grid-template-columns: minmax(0, 1fr); }
    #liste { border-right: 0; }
    #vue { display: none; }
    body.voit #liste { display: none; }
    body.voit #vue { display: grid; }
    #retour { display: inline; }
  }
</style>
</head>
<body>
<header>
  <h1>La pile</h1>
  <span id="compte">…</span>
  <input id="chercher" type="search" placeholder="Chercher" aria-label="Chercher dans la pile">
  <a id="editeur" href="/editeur">L'éditeur</a>
  <a href="https://claude.ai/artifact/PAuybWugSLUEEngQ1PPcPg" target="_blank" rel="noopener">Le grand tableau ↗</a>
</header>
<main>
  <nav id="liste" aria-label="Tout ce qui a été créé, le plus récent en haut"></nav>
  <section id="vue" aria-label="La page choisie">
    <div id="barre">
      <button id="retour" type="button">← La pile</button>
      <span id="nom"></span>
      <a id="seul" href="/" hidden>Ouvrir en grand</a>
    </div>
    <div id="vide">Choisis une page dans la liste : elle s'ouvre ici, dans le même onglet.</div>
  </section>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
// La clé de l'éditeur, quand la pile a été ouverte avec elle : pour enregistrer depuis l'éditeur.
const cle = params.get("cle") ?? "";
const avecCle = (adresse) => (cle ? `${adresse}${adresse.includes("?") ? "&" : "?"}cle=${encodeURIComponent(cle)}` : adresse);
$("editeur").href = avecCle("/editeur");

let choses = [];
let choisi = null;
// « nouveau » : ce qui a changé depuis la dernière visite (gardé dans ce navigateur seulement).
let vuAvant = 0;
try { vuAvant = Number(localStorage.getItem("pile-vu")) || 0; } catch {}
addEventListener("pagehide", () => { try { localStorage.setItem("pile-vu", String(Date.now())); } catch {} });

const formatJour = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const formatHeure = new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit" });
function nomDuJour(date) {
  const debut = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const ecart = Math.round((debut(new Date()) - debut(date)) / 86400000);
  if (ecart === 0) return "Aujourd'hui";
  if (ecart === 1) return "Hier";
  const nom = formatJour.format(date);
  return nom[0].toUpperCase() + nom.slice(1);
}
// Un morceau (Component) ne s'ouvre pas seul : on le montre dans l'éditeur.
const adresseDe = (chose) => (chose.morceau ? avecCle(`/editeur?fichier=${encodeURIComponent(chose.chemin)}`) : chose.chemin);
const adresseDeLaPile = (chemin) => avecCle(chemin ? `/pile?voir=${encodeURIComponent(chemin)}` : "/pile");

function dessiner() {
  const filtre = $("chercher").value.trim().toLowerCase();
  const visibles = choses.filter((c) => !filtre || `${c.titre} ${c.chemin} ${c.sorte}`.toLowerCase().includes(filtre));
  $("compte").textContent = filtre ? `${visibles.length} sur ${choses.length}` : `${choses.length} pages`;
  const liste = $("liste");
  liste.replaceChildren();
  let groupe = "";
  for (const chose of visibles) {
    const date = new Date(chose.date);
    const jour = nomDuJour(date);
    if (jour !== groupe) {
      groupe = jour;
      const titre = document.createElement("h2");
      titre.textContent = jour;
      liste.append(titre);
    }
    const lien = document.createElement("a");
    lien.href = adresseDeLaPile(chose.chemin);
    lien.dataset.chemin = chose.chemin;
    if (chose.chemin === choisi) lien.setAttribute("aria-current", "page");
    const titre = document.createElement("span");
    titre.className = "titre";
    titre.textContent = chose.titre;
    if (vuAvant && date.getTime() > vuAvant) {
      const marque = document.createElement("span");
      marque.className = "nouveau";
      marque.textContent = "nouveau";
      titre.append(marque);
    }
    const detail = document.createElement("span");
    detail.className = "detail";
    detail.textContent = `${chose.sorte} · ${chose.chemin.replace(/^\/exemples\//, "")} · ${formatHeure.format(date)}`;
    lien.append(titre, detail);
    liste.append(lien);
  }
}

async function charger() {
  try {
    const reponse = await fetch("/pile.json", { cache: "no-store" });
    choses = await reponse.json();
    dessiner();
  } catch {
    $("compte").textContent = "le serveur ne répond pas";
  }
}

function montrer(chemin, { historique = true } = {}) {
  const chose = choses.find((c) => c.chemin === chemin) ?? { chemin, titre: chemin.split("/").pop(), morceau: false };
  choisi = chemin;
  let cadre = document.querySelector("#vue iframe");
  if (!cadre) {
    cadre = document.createElement("iframe");
    cadre.title = "La page choisie";
    cadre.allow = "fullscreen; autoplay";
    $("vide").replaceWith(cadre);
  }
  cadre.src = adresseDe(chose);
  $("nom").textContent = `${chose.titre} — ${chemin}`;
  $("seul").href = adresseDe(chose);
  $("seul").hidden = false;
  document.body.classList.add("voit");
  document.title = `${chose.titre} · La pile`;
  for (const lien of $("liste").querySelectorAll("a[data-chemin]")) {
    if (lien.dataset.chemin === chemin) lien.setAttribute("aria-current", "page");
    else lien.removeAttribute("aria-current");
  }
  if (historique) history.pushState({ voir: chemin }, "", adresseDeLaPile(chemin));
}

// Revenir à la liste : la page choisie est arrêtée (plus de calcul, plus de son).
function revenir({ historique = true } = {}) {
  choisi = null;
  const cadre = document.querySelector("#vue iframe");
  if (cadre) {
    const vide = document.createElement("div");
    vide.id = "vide";
    vide.textContent = "Choisis une page dans la liste : elle s'ouvre ici, dans le même onglet.";
    cadre.replaceWith(vide);
  }
  $("nom").textContent = "";
  $("seul").hidden = true;
  document.body.classList.remove("voit");
  document.title = "La pile";
  for (const lien of $("liste").querySelectorAll("a[aria-current]")) lien.removeAttribute("aria-current");
  if (historique) history.pushState({}, "", adresseDeLaPile(null));
}

$("liste").addEventListener("click", (e) => {
  const lien = e.target.closest("a[data-chemin]");
  if (!lien || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault();
  montrer(lien.dataset.chemin);
});
$("retour").addEventListener("click", () => revenir());
$("chercher").addEventListener("input", dessiner);
addEventListener("popstate", (e) => (e.state?.voir ? montrer(e.state.voir, { historique: false }) : revenir({ historique: false })));
// De retour sur l'onglet : la liste est relue (rien ne tourne pendant qu'on regarde ailleurs).
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  document.title = document.title.replace(/^● /, "");
  charger();
});

// Claude montre quelque chose : la pile l'ouvre ici. L'onglet le signale par « ● » s'il est caché.
const ecoute = new EventSource("/pile/ecoute");
ecoute.addEventListener("montrer", async (e) => {
  const { chemin } = JSON.parse(e.data);
  await charger();
  montrer(chemin);
  if (document.visibilityState !== "visible") document.title = `● ${document.title}`;
});
ecoute.addEventListener("liste", () => charger());

await charger();
const voir = params.get("voir");
if (voir) {
  history.replaceState({ voir }, "", location.href);
  montrer(voir, { historique: false });
}
</script>
</body>
</html>
