<!doctype html>
<!-- L'éditeur HoloCode (ADR-046) : écrire un fichier .holo, sur le PC ou sur le téléphone.

     - À gauche, le texte ; à droite, la page telle que le visiteur la verra, mise à jour pendant
       qu'on écrit. Sur un téléphone, deux onglets : Code et Aperçu.
     - Une faute est montrée à sa place, avec le message du moteur ; quand le moteur sait le bon
       mot, un bouton corrige d'un clic. Le moteur, lui, reste strict (ADR-037).
     - En bas, des mots à toucher : les blocs, les réglages, les valeurs du fichier. Pas besoin de
       taper une majuscule au milieu d'un mot sur un téléphone.
     - « Enregistrer » écrit le fichier sur le PC, par le serveur local, avec la clé qu'il affiche
       à son démarrage. Sans la clé, on lit et on essaie, sans rien écrire. -->
<html lang="fr"><head><meta charset="utf-8"><title>Éditeur HoloCode</title>
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<link rel="icon" href="data:,">
<style>
  /* La page : une barre en haut, le texte et l'aperçu au milieu, les mots et l'état en bas. */
  :root {
    --fond: #101020; --fond-2: #171730; --trait: #2a2a4e; --texte: #e8e8f2; --doux: #8a8aa8;
    --or: #E9B44C; --bleu: #8fd3ff; --vert: #7be38f; --rouge: #ff8a80; --rose: #f4a5ff; --violet: #c3a6ff;
    --orange: #ffb86b; --selection: rgba(233, 180, 76, 0.28); --ligne-fautive: rgba(255, 138, 128, 0.12);
    --police-code: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
    --police: system-ui, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --fond: #fbfaf6; --fond-2: #f0eee6; --trait: #dcd8ca; --texte: #1d1d2e; --doux: #6b6b80;
      --or: #9a6a00; --bleu: #1f5fae; --vert: #1f7a4a; --rouge: #b3322b; --rose: #9b2d8f; --violet: #5b3fb0;
      --orange: #a8520a; --selection: rgba(154, 106, 0, 0.22); --ligne-fautive: rgba(179, 50, 43, 0.09);
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--fond); color: var(--texte); font: 15px/1.4 var(--police); display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; overflow: hidden; }
  button, input, a.bouton { font: inherit; }
  button, a.bouton { color: var(--texte); background: var(--fond-2); border: 1px solid var(--trait); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  button:hover, a.bouton:hover { border-color: var(--or); }
  button:focus-visible, a.bouton:focus-visible, input:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
  button[disabled] { opacity: 0.5; cursor: default; }

  .barre { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; border-bottom: 1px solid var(--trait); }
  .chemin { font-family: var(--police-code); font-size: 13px; color: var(--or); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 160px; }
  .modifie { color: var(--orange); font-size: 13px; white-space: nowrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .onglet { display: none; }
  #enregistrer { border-color: var(--or); }

  .plan { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
  .code { display: flex; min-height: 0; border-right: 1px solid var(--trait); }
  .numeros { margin: 0; padding: 12px 8px 40vh 8px; min-width: 3.2em; text-align: right; color: var(--doux); overflow: hidden; user-select: none;
    font: 14px/1.6 var(--police-code); white-space: pre; border-right: 1px solid var(--trait); }
  .ecrire { position: relative; flex: 1; min-width: 0; overflow: hidden; }
  #dessin, #code { position: absolute; inset: 0; margin: 0; padding: 12px 12px 40vh 10px; border: 0; font: 14px/1.6 var(--police-code);
    white-space: pre; tab-size: 2; letter-spacing: 0; font-variant-ligatures: none; }
  #dessin { overflow: hidden; pointer-events: none; color: var(--texte); }
  #code { width: 100%; height: 100%; background: transparent; color: transparent; caret-color: var(--or); resize: none; outline: none; overflow: auto; }
  #code::selection { background: var(--selection); color: transparent; }
  .ligne-fautive { position: absolute; left: 0; right: 0; height: calc(14px * 1.6); background: var(--ligne-fautive); border-left: 3px solid var(--rouge); pointer-events: none; }

  /* Les couleurs du texte. */
  .j-bloc { color: var(--or); font-weight: 600; }
  .j-param { color: var(--bleu); }
  .j-texte { color: var(--vert); }
  .j-dans-texte { color: var(--bleu); font-weight: 600; }
  .j-nombre { color: var(--rose); }
  .j-commentaire { color: var(--doux); font-style: italic; }
  .j-signal { color: var(--orange); }
  .j-demande { color: var(--orange); }
  .j-nom { color: var(--or); }
  .j-mot, .j-mot-cle, .j-etat { color: var(--violet); }
  .j-variable { color: var(--rose); }
  .j-nom-de-style { color: var(--or); }
  .j-ponctuation { color: var(--doux); }
  mark.faute { background: transparent; color: inherit; text-decoration: underline wavy var(--rouge); text-decoration-thickness: 2px; text-underline-offset: 3px; }

  .apercu { position: relative; min-height: 0; background: white; }
  .apercu iframe { width: 100%; height: 100%; border: 0; display: block; background: white; }
  .apercu-ancien { position: absolute; left: 8px; bottom: 8px; margin: 0; padding: 4px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.72); color: #fff; font-size: 13px; }

  .bas { border-top: 1px solid var(--trait); background: var(--fond); }
  .mots { display: flex; gap: 6px; padding: 6px 12px; overflow-x: auto; min-height: 44px; align-items: center; scrollbar-width: thin; }
  .mots:empty::before { content: "Les mots proposés apparaissent ici pendant que tu écris."; color: var(--doux); font-size: 13px; }
  .mots button { font-family: var(--police-code); font-size: 14px; padding: 6px 12px; border-radius: 999px; }
  .mots button:first-child { border-color: var(--or); }
  .etat { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 12px 10px; font-size: 14px; }
  .etat .juste { color: var(--vert); }
  .etat .fausse { color: var(--rouge); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  #corriger { border-color: var(--vert); color: var(--vert); }

  .fichiers { position: fixed; inset: 0 auto 0 0; width: min(420px, 92vw); background: var(--fond-2); border-right: 1px solid var(--trait); z-index: 10;
    display: flex; flex-direction: column; gap: 8px; padding: 12px; box-shadow: 8px 0 24px rgba(0, 0, 0, 0.4); }
  .fichiers[hidden] { display: none; }
  .fichiers-tete { display: flex; justify-content: space-between; align-items: center; }
  .fichiers input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--trait); background: var(--fond); color: var(--texte); }
  .fichiers ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .fichiers li.dossier { color: var(--doux); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin: 10px 0 4px; }
  .fichiers li a { display: block; padding: 6px 8px; border-radius: 6px; color: var(--texte); text-decoration: none; font-family: var(--police-code); font-size: 13px; }
  .fichiers li a:hover, .fichiers li a[aria-current] { background: var(--fond); color: var(--or); }
  .nouveau { display: flex; gap: 6px; align-items: end; }
  .nouveau label { flex: 1; font-size: 13px; color: var(--doux); display: flex; flex-direction: column; gap: 4px; }
  .message-temporaire { position: fixed; top: 56px; right: 12px; z-index: 20; background: var(--fond-2); border: 1px solid var(--or); border-radius: 8px; padding: 8px 12px; }

  /* Sur un téléphone : un onglet à la fois, Code ou Aperçu. */
  @media (max-width: 760px) {
    .plan { grid-template-columns: minmax(0, 1fr); }
    .onglet { display: inline-block; }
    .onglet[aria-pressed="true"] { border-color: var(--or); color: var(--or); }
    body:not(.voir-apercu) .apercu { display: none; }
    body.voir-apercu .code { display: none; }
    .code { border-right: 0; }
    .numeros { min-width: 2.6em; padding-left: 4px; padding-right: 6px; }
  }
</style>
</head>
<body>
<header class="barre">
  <button id="ouvrir-fichiers" type="button" aria-expanded="false" aria-controls="fichiers">Fichiers</button>
  <span id="chemin" class="chemin">…</span>
  <span id="modifie" class="modifie" hidden>● non enregistré</span>
  <div class="actions">
    <button id="voir-code" class="onglet" type="button" aria-pressed="true">Code</button>
    <button id="voir-apercu" class="onglet" type="button" aria-pressed="false">Aperçu</button>
    <button id="enregistrer" type="button" title="Ctrl + S">Enregistrer</button>
    <a id="ouvrir" class="bouton" target="_blank" rel="noopener">Ouvrir la page ↗</a>
  </div>
</header>
<main class="plan">
  <section class="code" aria-label="Le texte du fichier">
    <pre id="numeros" class="numeros" aria-hidden="true">1</pre>
    <div class="ecrire">
      <pre id="dessin" aria-hidden="true"></pre>
      <div id="ligne-fautive" class="ligne-fautive" hidden></div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Le texte du fichier .holo"></textarea>
    </div>
  </section>
  <section class="apercu" aria-label="La page">
    <iframe id="apercu" title="La page, telle que le visiteur la verra" sandbox="allow-same-origin"></iframe>
    <p id="apercu-ancien" class="apercu-ancien" hidden>Aperçu de la dernière version juste</p>
  </section>
</main>
<footer class="bas">
  <div id="mots" class="mots" role="toolbar" aria-label="Mots proposés"></div>
  <div class="etat" role="status" aria-live="polite">
    <span id="etat">Le moteur arrive…</span>
    <button id="corriger" type="button" hidden></button>
  </div>
</footer>
<div id="fichiers" class="fichiers" hidden>
  <div class="fichiers-tete"><strong>Les fichiers .holo</strong><button id="fermer-fichiers" type="button" aria-label="Fermer">✕</button></div>
  <input id="filtre" type="search" placeholder="Chercher un fichier…" aria-label="Chercher un fichier">
  <ul id="liste"></ul>
  <form id="nouveau" class="nouveau">
    <label for="nouveau-nom">Nouveau fichier<input id="nouveau-nom" placeholder="/exemples/mon-site/accueil.holo" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
    <button type="submit">Créer</button>
  </form>
</div>
<script type="module" src="/editeur.js"></script>
</body></html>
