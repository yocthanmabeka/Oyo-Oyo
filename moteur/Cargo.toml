[package]
name = "holo-engine"
version = "0.1.0"
edition = "2021"
description = "Moteur HoloCode, sprint Big Bang : un point lumineux qui se morcelle en mondes, piloté par un fichier .holo"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Le dessin (WebGPU, WebGL 2) : le moteur entier. Sans lui (`--no-default-features`), le moteur
# léger lit le fichier, fabrique la page et arbitre les valeurs, sans rien dessiner (ADR-053).
default = ["drawing"]
drawing = ["dep:wgpu"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }

# Tout ce qui touche au navigateur et à la carte graphique n'est compilé que pour WebAssembly.
# Le cœur (lecture du .holo, graines, mondes, navigation) reste du Rust pur, testable sur le PC.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "24", default-features = false, features = ["webgpu", "webgl", "wgsl"], optional = true }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "CssStyleDeclaration",
    "PointerEvent", "WheelEvent", "MouseEvent", "Event", "EventTarget", "AddEventListenerOptions",
    "Performance", "console",
] }

# Le serveur (`holo serve`, ADR-074) : seulement pour le PC, jamais dans le navigateur. SQLite
# est compilé avec le moteur (`bundled`) : rien à installer à côté, sous Windows comme ailleurs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.2"
# Les comptes (ADR-081), seulement pour le PC : la cryptographie ne s'écrit jamais à la main.
# Trois bibliothèques de RustCrypto, éprouvées et très employées : Argon2id pour les mots de passe
# (une empreinte lente, qu'on ne peut pas défaire) ; HMAC et SHA-1 pour le code à 6 chiffres
# (RFC 6238, celui que calculent les applications d'authentification).
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
hmac = "0.13"
sha1 = { version = "0.11", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
