[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holocode"
version = "0.1.0"
description = "Prototype executable du paradigme holoscenique"
requires-python = ">=3.11"

[project.scripts]
holocode = "holocode.cli:main"

[tool.setuptools.packages.find]
include = ["holocode*"]

